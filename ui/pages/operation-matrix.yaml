    - **Get a shipping document** (`get_shipping_documents`): Shipping v2 getShipmentDocuments. Roles: Direct-to-Consumer Shipping (restricted). Marketplaces: US, UK, IT, FR, ES. Scope: the seller''s labels in this country''s Amazon Shipping business. Read only. Personal data: yes. File: writes a file.

