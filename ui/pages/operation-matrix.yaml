# Generated from the closed runtime registry in runtime/catalog.py.
# Extension-owned parity tests fail if this file and the registry disagree.
page_id: operation-matrix
title: Operation matrix
description: Every method with its Amazon operation, roles, marketplaces, effect, personal data and files.
components:
- component_id: intro
  type: markdown
  title: How to read this page
  body: 'Every method is one Amazon call on one connection (one seller account in one marketplace). Scope says what the call can reach: searches and creations name the connection''s marketplace; a method that addresses an order, plan, shipment, feed or report by its Amazon ID reaches it in any marketplace of the same seller in the connection''s region, because Amazon''s IDs are region-wide. Per method: the Amazon operation and API version, the roles the application needs, where it works, whether it changes something on Amazon (an external effect, suppressed in test runs), whether its result holds personal data, and whether it reads or writes a file.

    '
- component_id: matrix_account
  type: markdown
  title: Account and connection
  body: '- **Test the connection** (`test_connection`): Sellers v1 getMarketplaceParticipations; Listings Items 2021-08-01 searchListingsItems. Roles: Selling Partner Insights or Product Listing (getMarketplaceParticipations), Product Listing (searchListingsItems). Marketplaces: all 23. Scope: this connection''s marketplace. Read only. Personal data: no. File: no.

    '
- component_id: matrix_orders
  type: markdown
  title: Orders
  body: '- **Find orders** (`search_orders`): Orders 2026-01-01 searchOrders (includedData FULFILLMENT, PROCEEDS); Orders v0 getOrders. Roles: Inventory and Order Tracking. Marketplaces: all 23. Scope: this connection''s marketplace. Read only. Personal data: no. File: no.

    - **Get an order** (`get_order`): Orders 2026-01-01 getOrder (includedData FULFILLMENT, PROCEEDS); Orders v0 getOrder. Roles: Inventory and Order Tracking. Marketplaces: all 23. Scope: the seller''s data in this connection''s region (by Amazon ID). Read only. Personal data: no. File: no.

    - **Get order items** (`get_order_items`): Orders 2026-01-01 getOrder (includedData FULFILLMENT, PROCEEDS); Orders v0 getOrderItems. Roles: Inventory and Order Tracking. Marketplaces: all 23. Scope: the seller''s data in this connection''s region (by Amazon ID). Read only. Personal data: no. File: no.

    - **Get buyer and shipping address** (`get_order_buyer_info`): Orders 2026-01-01 getOrder (includedData BUYER, RECIPIENT); Tokens 2021-03-01 createRestrictedDataToken + Orders v0 getOrderBuyerInfo, getOrderAddress. Roles: Inventory and Order Tracking, Direct-to-Consumer Shipping (restricted) for buyer and address data. Marketplaces: all 23. Scope: the seller''s data in this connection''s region (by Amazon ID). Read only. Personal data: yes. File: no.

    '
- component_id: matrix_shipping
  type: markdown
  title: FBM shipping
  body: '- **Confirm a shipment** (`confirm_shipment`): Orders v0 confirmShipment. Roles: Inventory and Order Tracking. Marketplaces: all 23. Scope: the seller''s data in this connection''s region (by Amazon ID). Changes Amazon (amazon_shipment_confirmation). Personal data: no. File: no.

