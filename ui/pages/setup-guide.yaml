page_id: setup-guide
title: Setup Guide
description: Register a private SP-API application once, then connect each seller account and marketplace with its refresh token.
# The OAuth configuration belongs to one project, so this page needs a project.
project_scoped: true
components:
  - component_id: setup_application
    type: markdown
    title: 1. Register a private SP-API application
    body: |
      This extension uses a **private** Selling Partner API application: one you
      register for your own seller account(s). Public applications listed in the
      Amazon Appstore, with Amazon's website authorization flow, are not supported
      by this version.

      1. In Seller Central open **Apps and Services > Develop Apps** (Solution
         Provider Portal). If you have no developer profile yet, Amazon asks you to
         register one and reviews it; that review can take days.
      2. **Add new app client.** Choose the API type *SP API*.
      3. Select the **roles**. Every connection needs one role whatever the
         workflows do, because connecting checks the Seller ID with Listings
         Items searchListingsItems: **Product Listing** (Amazon also accepts
         *Inventory and Order Tracking* for that call). A finance-only setup
         therefore needs Product Listing as well as Finance and Accounting.
         Add the further roles for what your workflows will do; the Operation
         matrix page lists the role each method needs:
         - *Product Listing*: listings, requirements, feeds, delete_listing; also
           needed for the India inbound steps.
         - *Pricing*: prices and offers.
         - *Inventory and Order Tracking*: orders, FBM inventory, confirm_shipment.
         - *Amazon Fulfillment*: FBA inventory and every fba_* inbound method.
         - *Finance and Accounting*: finances and settlement reports.
         - *Direct-to-Consumer Shipping* (restricted, approved by Amazon
           separately): buying Amazon Shipping labels, and buyer names and
           addresses.
      4. Save. Amazon assigns the app an **LWA Client ID** and **Client Secret**
         (View under *LWA credentials*).

  - component_id: app-credentials
    anchor_id: app-credentials
    type: markdown
    title: 2. Enter the application credentials
    body: |
      Below, create one configuration for the application and enter its **LWA
      Client ID** and **LWA Client Secret**. The Client ID is an identifier and is
      kept as ordinary configuration; the Client Secret is stored encrypted, and so
      is every imported refresh token. The extension receives neither the secret nor
      a refresh token: Flow Steward renews the access token itself and hands each
      step only that.

      Amazon makes you **rotate the client secret** periodically. When you
      generate a new secret in Developer Central, paste it into the configuration
      here; existing connections keep working with the new secret.

  - component_id: refresh-token
    anchor_id: refresh-token
    type: markdown
    title: 3. Authorize the application and copy the refresh token
    body: |
      Self-authorization must be done by the **primary user** of the Seller Central
      account.

      1. In **Develop Apps**, open the arrow next to *Edit App* and choose
         **Authorize app**.
      2. Amazon shows a **refresh token** (it starts with `Atzr|`). Copy it now; it
         is shown once. Generating a new one does not invalidate the old ones.
      3. A refresh token belongs to one seller account in one selling region
         (North America, Europe or Far East). For a seller in the UK and the US you
         authorize twice, once per region account, and get two tokens.

      If you add a role to the application later, authorize it again and import
      the new token: an old token does not pick up new roles.

  - component_id: seller-id
    anchor_id: seller-id
    type: markdown
    title: 4. Find the Seller ID
    body: |
      Seller Central > **Settings > Account Info > Merchant Token**. It is a string
      of capital letters and digits. Flow Steward checks it against Amazon when the
      connection is created: the check confirms that this token may act for this
      Seller ID in the chosen marketplace.

  - component_id: connect
    type: markdown
    title: 5. Create the connections
    body: |
      The **Connection** page opens once the application configuration in the
      **Amazon SP-API application** section above is ready: it says *Ready for
      authorization* or *Verified*. Until then the Connection tab is greyed out and
      the reason is shown under the tabs. *Needs attention* with *invalid_client*
      means Amazon refused the LWA client ID or client secret the last time they
      were used: check the client ID, choose **Replace**, paste the current client
      secret and save. *Incomplete* means a required field is still empty.

      Then open the **Connection** page. For every seller account and marketplace,
      add a connection with a name (for example *Amazon UK*), the refresh token, the
      Seller ID and the marketplace. The API region (NA, EU or FE) is chosen
      automatically from the marketplace.

      - **Amazon UK**: marketplace United Kingdom, API region EU.
      - **Amazon US**: marketplace United States, API region NA.

      After the checks pass, Flow Steward replaces the name you typed with the
      name Amazon confirmed: **store name · Amazon marketplace · Seller ID**, for
      example *Mugs Ltd · Amazon UK · A1SELLER0TEST1*, or *Amazon UK ·
      A1SELLER0TEST1* when the seller has no store name. This is the name the
      workflow connection picker shows, so one store in two marketplaces, or two
      sellers with the same store name, stay distinguishable. A very long store
      name is shortened; the marketplace and Seller ID are always kept.

      Two connections of the same seller in one region (for example UK and
      Germany) may use the same refresh token. Amazon's rate limits are shared by
      them. Any number of seller accounts can be connected side by side: each
      connection keeps its own Seller ID, marketplace and token, and a step only
      ever acts for the connection it names.

      All 23 Amazon marketplaces can be connected. Some methods work only in some
      of them; the Operation matrix lists where each one works, and a method
      called elsewhere answers unsupported_marketplace without contacting Amazon.

  - component_id: programs
    anchor_id: programs
    type: markdown
    title: 6. Programs some methods need
    body: |
      - **Amazon Shipping labels** (FBM): the seller must be able to buy
        shipping through Amazon in the marketplace (United States, United
        Kingdom, Italy, France or Spain), and the application needs the
        Direct-to-Consumer Shipping role. The extension sends the Amazon
        Shipping business of the connection's marketplace with every call.
      - **FBA inbound**: the seller must be enrolled in Fulfillment by Amazon in
        the marketplace. Brazil is not supported. Amazon's pages on partnered
        carriers differ and are listed here separately rather than merged: the
        partnered-carrier tutorial says such shipments are available only in the
        contiguous United States; the general inbound guide says that in the EU
        the carrier's and the Partnered Carrier Program terms must be accepted in
        Seller Central first; the India tutorial describes the delivery challan
        of Partnered Carrier Program shipments in the Amazon IN store. Whether a
        partnered option is offered for a shipment is Amazon's answer in
        fba_list_transportation_options, read across all its pages.
      - **Prep and labels (FBA)**: since January 1, 2026 Amazon no longer offers
        prep and item label services in the US store; the seller preps and
        labels the units. Prep details set in Seller Central are not visible to
        fba_list_prep_details: set them with fba_set_prep_details.
      - **India**: compliance details and the delivery challan run only on an
        India connection; the application needs Amazon Fulfillment and Product
        Listing. The self-ship appointment methods are offered on every
        connection except Brazil, because Amazon requires appointments wherever
        fulfillment centres mandate them (documented for India); elsewhere Amazon
        may refuse them.

      If a role is added to the application later, authorize it again and import
      the new refresh token into the existing connection (Replace token on the
      Connection page): the connection and its workflows stay as they are.

  - component_id: amazon-docs
    anchor_id: amazon-docs
    type: markdown
    title: Amazon's documentation
    body: |
      - [Self-authorizing a private application](https://developer-docs.amazon/sp-api/docs/self-authorization)
      - [Marketplace (store) IDs](https://developer-docs.amazon/sp-api/docs/marketplace-ids)
      - [Amazon Shipping API v2 reference](https://developer-docs.shipping.amazon.com/apis/docs/shipping-api-v2-reference)
      - [Fulfillment Inbound API (roles, prep details)](https://developer-docs.amazon/sp-api/docs/fulfillment-inbound-api)
      - [Creating an inbound shipment](https://developer-docs.amazon/sp-api/docs/create-an-inbound-shipment)
      - [Amazon-partnered carrier shipments](https://developer-docs.amazon/sp-api/docs/create-amazon-partnered-carrier-shipment)
      - [Inbound to fulfillment centres in India](https://developer-docs.amazon/sp-api/docs/ship-inventory-to-india-fc)
