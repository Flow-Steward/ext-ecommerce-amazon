# Generated from the closed runtime registry in runtime/catalog.py.
# Extension-owned parity tests fail if this file and the registry disagree.
forms:
- operation_id: test_connection
  title: Test the connection
  fields: []
- operation_id: verify_connection
  title: Verify the connection
  fields: []
- operation_id: search_orders
  title: Find orders
  fields:
  - name: api_version
    label: Amazon API version
    widget_type: select
    required: false
    help_text: 2026-01-01 (current, default) or v0 (legacy; Amazon removes its read operations on 2027-03-27).
    options:
    - value: '2026-01-01'
      label: '2026-01-01'
    - value: v0
      label: v0
  - name: created_after
    label: Created after
    widget_type: text
    required: false
    help_text: 'Orders created at or after this time. ISO 8601 with a time zone, for example 2026-11-01T00:00:00Z. Allowed: up to 40 characters.'
    placeholder: '2026-11-01T00:00:00Z'
  - name: created_before
    label: Created before
    widget_type: text
    required: false
    help_text: 'Orders created before this time. ISO 8601 with a time zone, for example 2026-11-01T00:00:00Z. Allowed: up to 40 characters.'
    placeholder: '2026-11-08T00:00:00Z'
  - name: last_updated_after
    label: Updated after
    widget_type: text
    required: false
    help_text: 'Orders updated at or after this time. ISO 8601 with a time zone, for example 2026-11-01T00:00:00Z. Allowed: up to 40 characters.'
    placeholder: '2026-11-01T00:00:00Z'
  - name: last_updated_before
    label: Updated before
    widget_type: text
    required: false
    help_text: 'Orders updated before this time. ISO 8601 with a time zone, for example 2026-11-01T00:00:00Z. Allowed: up to 40 characters.'
    placeholder: '2026-11-08T00:00:00Z'
  - name: statuses
    label: Statuses
    widget_type: multi_select
    required: false
    help_text: 'Only orders in these statuses. INVOICE_UNCONFIRMED is v0 only. Allowed: up to 8 entries.'
    options:
    - value: PENDING_AVAILABILITY
      label: PENDING_AVAILABILITY
    - value: PENDING
      label: PENDING
    - value: UNSHIPPED
      label: UNSHIPPED
    - value: PARTIALLY_SHIPPED
      label: PARTIALLY_SHIPPED
    - value: SHIPPED
      label: SHIPPED
    - value: CANCELLED
      label: CANCELLED
    - value: UNFULFILLABLE
      label: UNFULFILLABLE
    - value: INVOICE_UNCONFIRMED
      label: INVOICE_UNCONFIRMED
  - name: fulfilled_by
    label: Fulfilled by
    widget_type: multi_select
    required: false
    help_text: 'MERCHANT (FBM) or AMAZON (FBA). Allowed: up to 2 entries.'
    options:
    - value: MERCHANT
      label: MERCHANT
    - value: AMAZON
      label: AMAZON
  - name: max_results
    label: Page size
    widget_type: integer
    required: false
    help_text: 'Orders per page, 1 to 100. Allowed: from 1 to 100.'
  - name: included_data
    label: Included data (2026-01-01)
    widget_type: multi_select
    required: false
    help_text: 'Extra order sections to return. FULFILLMENT and PROCEEDS are always included. Allowed: up to 11 entries.'
    options:
    - value: BUYER
      label: BUYER
    - value: RECIPIENT
      label: RECIPIENT
    - value: PROCEEDS
      label: PROCEEDS
    - value: EXPENSE
      label: EXPENSE
    - value: PROMOTION
      label: PROMOTION
    - value: CANCELLATION
      label: CANCELLATION
    - value: FULFILLMENT
      label: FULFILLMENT
    - value: PACKAGES
      label: PACKAGES
    - value: TAX
      label: TAX
    - value: PAYMENT
      label: PAYMENT
    - value: FULFILLMENT_ORDERS
      label: FULFILLMENT_ORDERS
  - name: amazon_order_ids
    label: Amazon order IDs (v0)
    widget_type: json
    required: false
    help_text: 'Up to 50 order IDs. Allowed: up to 50 entries.'
    placeholder: '["123-1234567-1234567"]'
  - name: seller_order_id
    label: Seller order ID (v0)
    widget_type: text
    required: false
    help_text: 'Your own order identifier. Allowed: up to 64 characters.'
  - name: next_token
    label: Continuation token
    widget_type: text
    required: false
    help_text: 'next_token from the previous page of the same search, with the same filters and connection. Leave empty for the first page. Allowed: up to 4096 characters.'
- operation_id: get_order
  title: Get an order
  fields:
  - name: order_id
    label: Amazon order ID
    widget_type: text
    required: true
    help_text: 'The Amazon order ID, for example 123-1234567-1234567. Allowed: up to 64 characters.'
    placeholder: 123-1234567-1234567
  - name: api_version
    label: Amazon API version
    widget_type: select
    required: false
    help_text: 2026-01-01 (current, default) or v0 (legacy; Amazon removes its read operations on 2027-03-27).
    options:
    - value: '2026-01-01'
      label: '2026-01-01'
    - value: v0
      label: v0
  - name: included_data
    label: Included data (2026-01-01)
    widget_type: multi_select
    required: false
    help_text: 'Extra order sections to return. FULFILLMENT and PROCEEDS are always included. Allowed: up to 11 entries.'
    options:
    - value: BUYER
      label: BUYER
    - value: RECIPIENT
      label: RECIPIENT
    - value: PROCEEDS
      label: PROCEEDS
    - value: EXPENSE
      label: EXPENSE
    - value: PROMOTION
      label: PROMOTION
    - value: CANCELLATION
      label: CANCELLATION
    - value: FULFILLMENT
      label: FULFILLMENT
    - value: PACKAGES
      label: PACKAGES
    - value: TAX
      label: TAX
    - value: PAYMENT
      label: PAYMENT
    - value: FULFILLMENT_ORDERS
      label: FULFILLMENT_ORDERS
- operation_id: get_order_items
  title: Get order items
  fields:
  - name: order_id
    label: Amazon order ID
    widget_type: text
    required: true
    help_text: 'The Amazon order ID, for example 123-1234567-1234567. Allowed: up to 64 characters.'
    placeholder: 123-1234567-1234567
  - name: api_version
    label: Amazon API version
    widget_type: select
    required: false
    help_text: 2026-01-01 (current, default) or v0 (legacy; Amazon removes its read operations on 2027-03-27).
    options:
    - value: '2026-01-01'
      label: '2026-01-01'
    - value: v0
      label: v0
  - name: next_token
    label: Continuation token
    widget_type: text
    required: false
    help_text: 'next_token from the previous page of the same search, with the same filters and connection. Leave empty for the first page. Allowed: up to 4096 characters.'
- operation_id: get_order_buyer_info
  title: Get buyer and shipping address
  fields:
  - name: order_id
    label: Amazon order ID
    widget_type: text
    required: true
    help_text: 'The Amazon order ID, for example 123-1234567-1234567. Allowed: up to 64 characters.'
    placeholder: 123-1234567-1234567
  - name: api_version
    label: Amazon API version
    widget_type: select
    required: false
    help_text: 2026-01-01 (current, default) or v0 (legacy; Amazon removes its read operations on 2027-03-27).
    options:
    - value: '2026-01-01'
      label: '2026-01-01'
    - value: v0
      label: v0
- operation_id: confirm_shipment
  title: Confirm a shipment
  fields:
  - name: order_id
    label: Amazon order ID
    widget_type: text
    required: true
    help_text: 'The Amazon order ID, for example 123-1234567-1234567. Allowed: up to 64 characters.'
    placeholder: 123-1234567-1234567
  - name: package_reference_id
    label: Package reference ID
    widget_type: text
    required: true
    help_text: 'Your positive numeric identifier of this package within the order, for example 1. Allowed: up to 19 characters.'
  - name: carrier_code
    label: Carrier code
    widget_type: text
    required: true
    help_text: 'Amazon''s carrier code, for example UPS, DHL, Royal Mail, or Other with carrier_name. Allowed: up to 100 characters.'
  - name: carrier_name
    label: Carrier name
    widget_type: text
    required: false
    help_text: 'Required when carrier_code is Other. Allowed: up to 100 characters.'
  - name: shipping_method
    label: Shipping method
    widget_type: text
    required: false
    help_text: 'The ship method, for example Next Day. Allowed: up to 100 characters.'
  - name: tracking_number
    label: Tracking number
    widget_type: text
    required: true
    help_text: 'The carrier''s tracking number. Allowed: up to 100 characters.'
  - name: ship_date
    label: Ship date
    widget_type: text
    required: true
    help_text: 'When the package was shipped. ISO 8601 with a time zone, for example 2026-11-01T00:00:00Z. Allowed: up to 40 characters.'
  - name: ship_from_supply_source_id
    label: Supply source ID
    widget_type: text
    required: false
    help_text: 'The supply source the package ships from, if you use supply sources. Allowed: up to 128 characters.'
  - name: items
    label: Order items
    widget_type: json
    required: true
    help_text: 'The order items and quantities in this package. Allowed: up to 100 entries.'
  - name: cod_collection_method
    label: COD collection method
    widget_type: select
    required: false
    help_text: Cash-on-delivery collection method (Japan only).
    options:
    - value: DirectPayment
      label: DirectPayment
- operation_id: update_shipment_status
  title: Update shipment status
  fields:
  - name: order_id
    label: Amazon order ID
    widget_type: text
    required: true
    help_text: 'The Amazon order ID, for example 123-1234567-1234567. Allowed: up to 64 characters.'
    placeholder: 123-1234567-1234567
  - name: shipment_status
    label: Shipment status
    widget_type: select
    required: true
    help_text: The status to apply.
    options:
    - value: ReadyForPickup
      label: ReadyForPickup
    - value: PickedUp
      label: PickedUp
    - value: RefusedPickup
      label: RefusedPickup
  - name: items
    label: Order items
    widget_type: json
    required: false
    help_text: 'For a partial update: the order items and quantities the status applies to. Allowed: up to 100 entries.'
- operation_id: get_shipping_rates
  title: Get shipping rates
  fields:
  - name: packages
    label: Package
    widget_type: json
    required: true
    help_text: 'Exactly one package: Amazon Shipping quotes one package per request. Dimensions in INCH or CENTIMETER, weight in GRAM, KILOGRAM, OUNCE or POUND, values in the marketplace currency. item_identifier is the order_item_id from get_order_items. Allowed: up to 1 entries. Example: [{"package_client_reference_id": "order-123-pkg-1", "dimensions": {"length": 30, "width": 20, "height": 10, "unit": "CENTIMETER"}, "weight": {"value": 1.2, "unit": "KILOGRAM"}, "insured_value": {"value": 25.0, "unit": "GBP"}, "items": [{"item_identifier": "12345678901234", "quantity": 1, "item_value": {"value": 25.0, "unit": "GBP"}, "description": "Blue mug", "weight": {"value": 1.0, "unit": "KILOGRAM"}}]}]'
  - name: return_to
    label: Return to
    widget_type: json
    required: false
    help_text: 'The return to address. Example: {"name": "Warehouse 1", "company_name": "Example Ltd", "address_line1": "1 Example Street", "city": "London", "state_or_region": "London", "postal_code": "EC1A 1BB", "country_code": "GB", "phone_number": "+442000000000"}'
  - name: ship_date
    label: Ship date
    widget_type: text
    required: false
    help_text: 'Only for a future pickup: ISO 8601 with a time zone, for example 2026-11-10T09:00:00Z. Leave empty to ship today.'
  - name: ship_from
    label: Ship from
    widget_type: json
    required: true
    help_text: 'The address the package leaves from, in the marketplace''s country. Example: {"name": "Warehouse 1", "company_name": "Example Ltd", "address_line1": "1 Example Street", "city": "London", "state_or_region": "London", "postal_code": "EC1A 1BB", "country_code": "GB", "phone_number": "+442000000000"}'
  - name: shipper_instruction
    label: Shipper instruction
    widget_type: json
    required: false
    help_text: This field describe shipper instruction.
  - name: tax_details
    label: Tax details
    widget_type: json
    required: false
    help_text: A list of tax detail information.
  - name: value_added_services
    label: Value added services
    widget_type: json
    required: false
    help_text: A collection of supported value-added services.
  - name: amazon_order_id
    label: Amazon order ID
    widget_type: text
    required: true
    help_text: 'The Amazon order this package fulfils, for example 123-1234567-1234567. Allowed: up to 64 characters.'
    placeholder: 123-1234567-1234567
- operation_id: get_shipping_additional_inputs
  title: Get shipping additional inputs
  fields:
  - name: request_token
    label: Request token
    widget_type: text
    required: true
    help_text: request_token from get_shipping_rates (not an access token).
  - name: rate_id
    label: Rate ID
    widget_type: text
    required: true
    help_text: rate_id of the chosen offer.
- operation_id: purchase_shipping_shipment
  title: Purchase a shipping label
  fields:
  - name: additional_inputs
    label: Additional inputs
    widget_type: json
    required: false
    help_text: 'Only when the rate requires them: the values get_shipping_additional_inputs asks for, with exactly the keys of its schema.'
  - name: rate_id
    label: Rate ID
    widget_type: text
    required: true
    help_text: rate_id of the chosen offer.
  - name: request_token
    label: Request token
    widget_type: text
    required: true
    help_text: request_token from get_shipping_rates (not an access token).
  - name: requested_document_specification
    label: Label format
    widget_type: json
    required: true
    help_text: 'One of the supported_document_specifications of the chosen rate: format PDF, PNG or ZPL, size, dpi (ZPL only: 203 or 300), page layout, file joining and the document types. A specification the rate does not offer is refused by Amazon.'
    placeholder: '{"format": "PDF", "size": {"width": 4, "length": 6, "unit": "INCH"}, "need_file_joining": false, "requested_document_types": ["LABEL"]}'
  - name: requested_value_added_services
    label: Value-added services
    widget_type: json
    required: false
    help_text: The value-added services to be added to a shipping service purchase.
- operation_id: get_shipping_documents
  title: Get a shipping document
  fields:
  - name: shipment_id
    label: Shipment ID
    widget_type: text
    required: true
    help_text: shipment_id from purchase_shipping_shipment.
  - name: package_client_reference_id
    label: Package reference
    widget_type: text
    required: true
    help_text: package_client_reference_id of the package, as sent to get_shipping_rates.
  - name: format
    label: Format
    widget_type: text
    required: false
    help_text: 'PDF, PNG or ZPL; one the rate supported. Empty: the purchased format.'
  - name: dpi
    label: DPI
    widget_type: number
    required: false
    help_text: 'ZPL only: 203 or 300.'
  - name: document_type
    label: Document type
    widget_type: select
    required: false
    help_text: Which document of the package to store. Default LABEL.
    options:
    - value: LABEL
      label: LABEL
    - value: PACKSLIP
      label: PACKSLIP
    - value: RECEIPT
      label: RECEIPT
    - value: CUSTOM_FORM
      label: CUSTOM_FORM
- operation_id: get_shipping_tracking
  title: Get shipment tracking
  fields:
  - name: tracking_id
    label: Tracking ID
    widget_type: text
    required: true
    help_text: tracking_id from the purchase.
  - name: carrier_id
    label: Carrier ID
    widget_type: text
    required: true
    help_text: carrier_id of the purchased rate.
- operation_id: cancel_shipping_shipment
  title: Cancel a shipping label
  fields:
  - name: shipment_id
    label: Shipment ID
    widget_type: text
    required: true
    help_text: shipment_id from the purchase.
- operation_id: search_catalog_items
  title: Search the Amazon catalog
  fields:
  - name: identifiers
    label: Identifiers
    widget_type: json
    required: false
    help_text: 'Up to 20 product identifiers. Allowed: up to 20 entries.'
  - name: identifiers_type
    label: Identifier type
    widget_type: select
    required: false
    help_text: The type of every value in identifiers.
    options:
    - value: ASIN
      label: ASIN
    - value: EAN
      label: EAN
    - value: GTIN
      label: GTIN
    - value: ISBN
      label: ISBN
    - value: JAN
      label: JAN
    - value: MINSAN
      label: MINSAN
    - value: SKU
      label: SKU
    - value: UPC
      label: UPC
  - name: keywords
    label: Keywords
    widget_type: json
    required: false
    help_text: 'Up to 20 search keywords. Allowed: up to 20 entries.'
    placeholder: '["blue ceramic mug"]'
  - name: brand_names
    label: Brands
    widget_type: json
    required: false
    help_text: 'Keyword search only: limit to these brands. Allowed: up to 20 entries.'
  - name: classification_ids
    label: Classification IDs
    widget_type: json
    required: false
    help_text: 'Keyword search only: limit to these browse classifications. Allowed: up to 20 entries.'
  - name: keywords_locale
    label: Keywords language
    widget_type: text
    required: false
    help_text: 'Keyword search only: the language of the keywords. Allowed: up to 10 characters.'
    placeholder: en_GB
  - name: included_data
    label: Included data
    widget_type: multi_select
    required: false
    help_text: 'Catalog data sets to return (Amazon default: summaries). relationships gives variation parents and children; vendorDetails needs a vendor account. Allowed: up to 10 entries.'
    options:
    - value: attributes
      label: attributes
    - value: classifications
      label: classifications
    - value: dimensions
      label: dimensions
    - value: identifiers
      label: identifiers
    - value: images
      label: images
    - value: productTypes
      label: productTypes
    - value: relationships
      label: relationships
    - value: salesRanks
      label: salesRanks
    - value: summaries
      label: summaries
    - value: vendorDetails
      label: vendorDetails
  - name: locale
    label: Locale
    widget_type: text
    required: false
    help_text: 'Locale for localized summaries, for example en_GB. Allowed: up to 10 characters.'
  - name: page_size
    label: Page size
    widget_type: integer
    required: false
    help_text: 'Items per page, 1 to 20. Allowed: from 1 to 20.'
  - name: next_token
    label: Continuation token
    widget_type: text
    required: false
    help_text: 'next_token from the previous page of the same search, with the same filters and connection. Leave empty for the first page. Allowed: up to 4096 characters.'
- operation_id: get_catalog_item
  title: Get a catalog item
  fields:
  - name: asin
    label: ASIN
    widget_type: text
    required: true
    help_text: 'The 10-character Amazon Standard Identification Number. Allowed: up to 10 characters.'
    placeholder: B000000000
  - name: included_data
    label: Included data
    widget_type: multi_select
    required: false
    help_text: 'Catalog data sets to return (Amazon default: summaries). relationships gives variation parents and children; vendorDetails needs a vendor account. Allowed: up to 10 entries.'
    options:
    - value: attributes
      label: attributes
    - value: classifications
      label: classifications
    - value: dimensions
      label: dimensions
    - value: identifiers
      label: identifiers
    - value: images
      label: images
    - value: productTypes
      label: productTypes
    - value: relationships
      label: relationships
    - value: salesRanks
      label: salesRanks
    - value: summaries
      label: summaries
    - value: vendorDetails
      label: vendorDetails
  - name: locale
    label: Locale
    widget_type: text
    required: false
    help_text: 'Locale for localized summaries, for example en_GB. Allowed: up to 10 characters.'
- operation_id: search_listings
  title: Find listings
  fields:
  - name: identifiers
    label: Identifiers
    widget_type: json
    required: false
    help_text: 'Up to 20 product identifiers of identifiers_type. Allowed: up to 20 entries.'
  - name: identifiers_type
    label: Identifier type
    widget_type: select
    required: false
    help_text: The type of every value in identifiers.
    options:
    - value: ASIN
      label: ASIN
    - value: EAN
      label: EAN
    - value: FNSKU
      label: FNSKU
    - value: GTIN
      label: GTIN
    - value: ISBN
      label: ISBN
    - value: JAN
      label: JAN
    - value: MINSAN
      label: MINSAN
    - value: SKU
      label: SKU
    - value: UPC
      label: UPC
  - name: variation_parent_sku
    label: Variation parent SKU
    widget_type: text
    required: false
    help_text: 'Only variation children of this SKU. Allowed: up to 200 characters.'
  - name: package_hierarchy_sku
    label: Package hierarchy SKU
    widget_type: text
    required: false
    help_text: 'Only listings that contain or are contained by this SKU. Allowed: up to 200 characters.'
  - name: created_after
    label: Created after
    widget_type: text
    required: false
    help_text: 'Listings created at or after this time. ISO 8601 with a time zone, for example 2026-11-01T00:00:00Z. Allowed: up to 40 characters.'
    placeholder: '2026-11-01T00:00:00Z'
  - name: created_before
    label: Created before
    widget_type: text
    required: false
    help_text: 'Listings created at or before this time. ISO 8601 with a time zone, for example 2026-11-01T00:00:00Z. Allowed: up to 40 characters.'
    placeholder: '2026-11-08T00:00:00Z'
  - name: last_updated_after
    label: Updated after
    widget_type: text
    required: false
    help_text: 'Listings updated at or after this time. ISO 8601 with a time zone, for example 2026-11-01T00:00:00Z. Allowed: up to 40 characters.'
    placeholder: '2026-11-01T00:00:00Z'
  - name: last_updated_before
    label: Updated before
    widget_type: text
    required: false
    help_text: 'Listings updated at or before this time. ISO 8601 with a time zone, for example 2026-11-01T00:00:00Z. Allowed: up to 40 characters.'
    placeholder: '2026-11-08T00:00:00Z'
  - name: with_issue_severity
    label: With issue severity
    widget_type: multi_select
    required: false
    help_text: 'Only listings with issues of these severities. Allowed: up to 2 entries.'
    options:
    - value: WARNING
      label: WARNING
    - value: ERROR
      label: ERROR
  - name: with_status
    label: With status
    widget_type: multi_select
    required: false
    help_text: 'Only listings with these statuses. Allowed: up to 2 entries.'
    options:
    - value: BUYABLE
      label: BUYABLE
    - value: DISCOVERABLE
      label: DISCOVERABLE
  - name: without_status
    label: Without status
    widget_type: multi_select
    required: false
    help_text: 'Only listings without these statuses. Allowed: up to 2 entries.'
    options:
    - value: BUYABLE
      label: BUYABLE
    - value: DISCOVERABLE
      label: DISCOVERABLE
  - name: sort_by
    label: Sort by
    widget_type: select
    required: false
    help_text: Sort field (Amazon default lastUpdatedDate).
    options:
    - value: sku
      label: sku
    - value: createdDate
      label: createdDate
    - value: lastUpdatedDate
      label: lastUpdatedDate
  - name: sort_order
    label: Sort order
    widget_type: select
    required: false
    help_text: ASC or DESC (Amazon default DESC).
    options:
    - value: ASC
      label: ASC
    - value: DESC
      label: DESC
  - name: included_data
    label: Included data
    widget_type: multi_select
    required: false
    help_text: 'Listing data sets to return. Default for get_listing: summaries, attributes, issues, offers, fulfillmentAvailability; for search_listings Amazon''s default is summaries. Allowed: up to 8 entries.'
    options:
    - value: summaries
      label: summaries
    - value: attributes
      label: attributes
    - value: issues
      label: issues
    - value: offers
      label: offers
    - value: fulfillmentAvailability
      label: fulfillmentAvailability
    - value: procurement
      label: procurement
    - value: relationships
      label: relationships
    - value: productTypes
      label: productTypes
  - name: issue_locale
    label: Issue language
    widget_type: text
    required: false
    help_text: 'Locale for issue messages, for example en_US or de_DE. Defaults to the marketplace language. Allowed: up to 5 characters.'
