- operation_id: fba_generate_transportation_options
  display_name: 'FBA: generate transportation options'
  description: 'Asks Amazon for carrier options per shipment: small parcel or LTL/FTL, Amazon-partnered or the seller''s own carrier, from the ready-to-ship window, contact and, for pallets, pallet and freight details. Amazon-partnered carriers are offered in the contiguous United States (and through the Partnered Carrier Program in India); in the EU the seller must first accept the carrier''s and Amazon''s terms in Seller Central. Availability: Every Amazon marketplace except Brazil, where Amazon does not support inbound shipment creation through the API. Scope: The seller''s data in the connection''s region: the method addresses a resource by its Amazon ID or reads seller-wide data, and Amazon answers for any marketplace of the seller in that region. Check marketplace_ids in the result where it matters.'
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  effect_kind: amazon_fba_transportation_options_generation
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: inbound_plan_id
    value_type: text
    required: true
    schema:
      description: inbound_plan_id from fba_create_inbound_plan or fba_list_inbound_plans (wf…).
      maxLength: 38
      minLength: 38
      type: string
      title: Inbound plan ID
  - name: placement_option_id
    value_type: text
    required: true
    schema:
      description: 'The placement option to generate transportation options for. Format (checked by Amazon): ^[a-zA-Z0-9-]*$'
      maxLength: 38
      minLength: 38
      type: string
      title: Placement option ID
  - name: shipment_transportation_configurations
    value_type: array
    required: true
    schema:
      description: List of shipment transportation configurations.
      items:
        additionalProperties: false
        description: Details needed to generate the transportation options.
        properties:
          contact_information:
            additionalProperties: false
            description: The seller's contact information.
            properties:
              email:
                description: The email address.
                maxLength: 1024
                minLength: 1
                type: string
              name:
                description: The contact's name.
                maxLength: 50
                minLength: 1
                type: string
              phone_number:
                description: The phone number.
                maxLength: 20
                minLength: 1
                type: string
            required:
            - name
            - phone_number
            type: object
            examples:
            - email: email@email.com
              name: name
              phone_number: '1234567890'
          freight_information:
            additionalProperties: false
            description: Freight information describes the SKUs that are in transit. Freight carrier options and quotes will only be returned if the freight information is provided.
            properties:
              declared_value:
                additionalProperties: false
                description: The type and amount of currency.
                properties:
                  amount:
                    description: Decimal value of the currency.
                    type: number
                  code:
                    description: ISO 4217 standard of a currency code.
                    maxLength: 3
                    minLength: 3
                    type: string
                required:
                - amount
                - code
                type: object
              freight_class:
                description: 'Freight class. Possible values: `NONE`, `FC_50`, `FC_55`, `FC_60`, `FC_65`, `FC_70`, `FC_77_5`, `FC_85`, `FC_92_5`, `FC_100`, `FC_110`, `FC_125`, `FC_150`, `FC_175`, `FC_200`, `FC_250`, `FC_300`, `FC_400`, `FC_500`.'
                maxLength: 1024
                minLength: 1
                type: string
            required: []
            type: object
            examples:
            - declared_value:
                amount: 5.5
                code: CAD
              freight_class: FC_50
          pallets:
            description: List of pallet configuration inputs.
            items:
              additionalProperties: false
              description: Contains input information about a pallet to be used in the inbound plan.
              properties:
                dimensions:
                  additionalProperties: false
                  description: Measurement of a package's dimensions.
                  properties:
                    height:
                      description: The height of a package.
                      maximum: 100000
                      minimum: 0
                      type: number
                    length:
                      description: The length of a package.
                      maximum: 100000
                      minimum: 0
                      type: number
                    unit_of_measurement:
                      description: 'Unit of linear measure. Values: IN: Inches; CM: Centimeters.'
                      enum:
                      - IN
                      - CM
                      type: string
                    width:
                      description: The width of a package.
                      maximum: 100000
                      minimum: 0
                      type: number
                  required:
                  - height
                  - length
                  - unit_of_measurement
                  - width
                  type: object
                quantity:
                  description: The number of containers where all other properties like weight or dimensions are identical.
                  maximum: 10000
                  minimum: 1
                  type: integer
                stackability:
                  description: 'Indicates whether pallets will be stacked when carrier arrives for pick-up. Values: STACKABLE: A pallet that can be stacked on top of another pallet; NON_STACKABLE: A pallet that cannot be stacked on top of another pallet.'
                  enum:
                  - STACKABLE
                  - NON_STACKABLE
                  type: string
                weight:
                  additionalProperties: false
                  description: The weight of a package.
                  properties:
                    unit:
                      description: 'Unit of the weight being measured. Values: LB: Pounds; KG: Kilograms.'
                      enum:
                      - LB
                      - KG
                      type: string
                    value:
                      description: Value of a weight.
                      maximum: 100000
                      minimum: 0
                      type: number
                  required:
                  - unit
                  - value
                  type: object
              required:
              - quantity
              type: object
              examples:
              - dimensions:
                  height: 5
                  length: 3
                  unit_of_measurement: CM
                  width: 4
                quantity: 2
                stackability: STACKABLE
                weight:
                  unit: KG
                  value: 5.5
            type: array
          ready_to_ship_window:
            additionalProperties: false
            description: The range of dates within which the seller intends to ship their items. This is the pick-up date or 'ready to ship' date, not an estimated delivery date.
            properties:
              start:
                description: The start date of the window. In [ISO 8601](https://developer-docs.amazon.com/sp-api/docs/iso-8601) datetime format with minute precision. Supports patterns `yyyy-MM-ddTHH:mmZ`, `yyyy-MM-ddTHH:mm:ssZ`, or `yyyy-MM-ddTHH:mm:ss.sssZ`. Note that non-zero second and millisecond components are removed.
                format: date-time
                type: string
            required:
            - start
