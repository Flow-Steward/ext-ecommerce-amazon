- operation_id: fba_get_item_eligibility_preview
  display_name: 'FBA: check item eligibility'
  description: 'Says whether one ASIN can be sent to Amazon''s fulfillment centres (program INBOUND, in the connection''s marketplace) or commingled (COMMINGLING), with Amazon''s ineligibility reasons. Availability: Every Amazon marketplace except Brazil, where Amazon does not support inbound shipment creation through the API.'
  operation_kind: source
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: asin
    value_type: text
    required: true
    schema:
      description: The ASIN of the item for which you want an eligibility preview.
      type: string
      title: ASIN
      examples:
      - B000000000
  - name: program
    value_type: text
    required: true
    schema:
      description: The program that you want to check eligibility against.
      enum:
      - INBOUND
      - COMMINGLING
      type: string
      title: Program
  outputs:
  - name: asin
    value_type: text
    schema:
      description: The ASIN for which eligibility was determined.
      type:
      - string
      - 'null'
  - name: ineligibility_reason_list
    value_type: array
    schema:
