- operation_id: fba_list_transportation_options
  display_name: 'FBA: list transportation options'
  description: 'Lists transportation options for a placement option or a shipment: shipping mode, solution (Amazon-partnered or own carrier), carrier and, for partnered carriers, the quote with cost, currency and expiration. Returns one page and next_token; nothing loops over the remaining pages. Read every page (next_token) before concluding that no Amazon-partnered option is offered. Availability: Every Amazon marketplace except Brazil, where Amazon does not support inbound shipment creation through the API. Scope: The seller''s data in the connection''s region: the method addresses a resource by its Amazon ID or reads seller-wide data, and Amazon answers for any marketplace of the seller in that region. Check marketplace_ids in the result where it matters.'
  operation_kind: source
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  inputs:
