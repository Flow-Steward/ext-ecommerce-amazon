  description: 'Changes selected top-level attributes of an existing listing with JSON Patch operations (add, replace, merge, delete on /attributes/<name>); other attributes stay as they are. Amazon requires the listing''s product_type. Amazon answers ACCEPTED when the submission passed its synchronous checks; it applies the change later (usually within minutes) and may still raise issues, so accepted is not applied: read the listing with get_listing to confirm. INVALID means Amazon refused it and nothing changed (accepted false, external_effect_status failed).'
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  effect_kind: amazon_listing_patch
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
