  display_name: Get feed result
  description: 'Reads a feed and, once Amazon has finished it, its processing report: summary counts, messages that failed (at least one ERROR) and messages applied with warnings, each with messageId, sku and Amazon''s issues. Messages without issues appear only in the summary count. The issue lists together are capped at 2.5 MB (feed-level issues first, then failed, then accepted with issues); issues_truncated is true when entries were left out, and save_report_file keeps the full report. While the feed is still processing it returns the status alone; it never waits. Scope: The seller''s data in the connection''s region: the method addresses a resource by its Amazon ID or reads seller-wide data, and Amazon answers for any marketplace of the seller in that region. Check marketplace_ids in the result where it matters.'
