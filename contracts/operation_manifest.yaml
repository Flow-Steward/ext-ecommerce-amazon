            items:
              additionalProperties: false
              description: Input information for a given box.
              properties:
                content_information_source:
                  description: 'Indication of how box content is meant to be provided. Values: BOX_CONTENT_PROVIDED: Box contents have been provided by the seller; MANUAL_PROCESS: Box contents will be manually processed during receive. This service incurs charges; BARCODE_2D: Box contents information is provided by a barcode on the shipment. For more information, refer to [Using 2D barcodes for box content information](https://sellercentral.amazon.com/help/hub/reference/GJWALJCN6JKWJX5A) on Seller Central.'
                  enum:
                  - BOX_CONTENT_PROVIDED
                  - MANUAL_PROCESS
                  - BARCODE_2D
                  type: string
                dimensions:
                  additionalProperties: false
                  description: Measurement of a package's dimensions.
                  properties:
                    height:
                      description: The height of a package.
                      maximum: 100000
                      minimum: 0
                      type: number
                    length:
                      description: The length of a package.
                      maximum: 100000
                      minimum: 0
                      type: number
                    unit_of_measurement:
                      description: 'Unit of linear measure. Values: IN: Inches; CM: Centimeters.'
                      enum:
