- operation_id: fba_list_prep_details
  display_name: 'FBA: list prep details'
  description: 'Reads the prep category and prep types set through the API (fba_set_prep_details) for up to 100 MSKUs in the connection''s marketplace. Prep details entered in Seller Central are not returned here; set them with fba_set_prep_details as a separate step. Availability: Every Amazon marketplace except Brazil, where Amazon does not support inbound shipment creation through the API.'
  operation_kind: source
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: mskus
    value_type: array
    required: true
    schema:
      description: Up to 100 seller SKUs.
      items:
        maxLength: 255
        minLength: 1
        type: string
      maxItems: 100
      minItems: 1
      type: array
      title: MSKUs
      examples:
      - - MUG-BLUE-01
  outputs:
  - name: msku_prep_details
    value_type: array
    schema:
      description: A list of MSKUs and related prep details.
      items:
        description: An MSKU and its related prep details.
        properties:
          all_owners_constraint:
            description: 'A constraint that applies to all owners. If no constraint is specified, defer to any individual owner constraints. Values: MUST_MATCH: All owners must match.'
            type:
            - string
            - 'null'
          label_owner_constraint:
            description: 'A constraint that can apply to an individual owner. If no constraint is specified, both `AMAZON` and `SELLER` are acceptable. Values: AMAZON_ONLY: Only `AMAZON` is accepted as an owner; NONE_ONLY: Only `NONE` is accepted as an owner; SELLER_ONLY: Only `SELLER` is accepted as an owner.'
            type:
            - string
            - 'null'
          msku:
            description: The merchant SKU, a merchant-supplied identifier for a specific SKU.
            type:
            - string
            - 'null'
          prep_category:
