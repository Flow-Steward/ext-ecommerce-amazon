    required: true
  - name: inbound_plan_id
    value_type: text
    required: true
    schema:
      description: inbound_plan_id from fba_create_inbound_plan or fba_list_inbound_plans (wf…).
      maxLength: 38
      minLength: 38
      type: string
      title: Inbound plan ID
  - name: page_size
    value_type: integer
    required: false
    schema:
      description: How many rows one page returns.
      maximum: 20
      minimum: 1
      type: integer
      title: Page size
  - name: placement_option_id
    value_type: text
    required: false
    schema:
      description: 'The placement option to get transportation options for. Either `placementOptionId` or `shipmentId` must be specified. Format (checked by Amazon): ^[a-zA-Z0-9-]*$'
      maxLength: 38
      minLength: 38
      type: string
      title: Placement option ID
  - name: shipment_id
    value_type: text
    required: false
    schema:
      description: The 2024-03-20 shipment_id (sh…) from fba_get_inbound_plan or a placement option. Not the FBA… shipment confirmation ID.
      maxLength: 38
      minLength: 38
      type: string
      title: Shipment ID
  - name: next_token
    value_type: text
    required: false
    schema:
      type: string
      title: Continuation token
      description: next_token from the previous page of the same search, with the same filters and connection. Leave empty for the first page.
      minLength: 1
      maxLength: 4096
  outputs:
  - name: transportation_options
    value_type: array
    schema:
      description: Transportation options generated for the placement option.
      items:
        description: Contains information pertaining to a transportation option and the related carrier.
        properties:
          carrier:
            description: The carrier for the inbound shipment.
            properties:
              alpha_code:
                description: The carrier code. For example, USPS or DHLEX.
                type:
                - string
                - 'null'
              name:
                description: The name of the carrier.
                type:
                - string
                - 'null'
            required: []
            type:
            - object
            - 'null'
          carrier_appointment:
            description: Contains details for a transportation carrier appointment. This appointment is vended out by Amazon and is an indicator for when a transportation carrier is accepting shipments to be picked up.
            properties:
              end_time:
                description: The end timestamp of the appointment in UTC.
                format: date-time
                type:
                - string
                - 'null'
              start_time:
                description: The start timestamp of the appointment in UTC.
                format: date-time
                type:
                - string
                - 'null'
            required:
            - end_time
            - start_time
            type:
            - object
            - 'null'
          preconditions:
            description: Identifies a list of preconditions for confirming the transportation option.
            items:
              description: 'Identifies type of Transportation Option precondition. Values: `CONFIRMED_DELIVERY_WINDOW`'
              type:
              - string
              - 'null'
            type:
            - array
            - 'null'
          quote:
            description: The estimated shipping cost associated with the transportation option.
            properties:
              cost:
                description: The type and amount of currency.
                properties:
                  amount:
                    description: Decimal value of the currency.
                    type:
                    - number
                    - string
                    - 'null'
                  code:
                    description: ISO 4217 standard of a currency code.
                    type:
                    - string
                    - 'null'
                required:
