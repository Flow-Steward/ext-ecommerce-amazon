  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: packages
    value_type: array
    required: true
    schema:
      description: 'Exactly one package: Amazon Shipping quotes one package per request. Dimensions in INCH or CENTIMETER, weight in GRAM, KILOGRAM, OUNCE or POUND, values in the marketplace currency. item_identifier is the order_item_id from get_order_items.'
      items:
        additionalProperties: false
        description: A package to be shipped through a shipping service offering.
        properties:
          charges:
            description: A list of charges based on the shipping service charges applied on a package.
            items:
              additionalProperties: false
              description: The type and amount of a charge applied on a package.
              properties:
                amount:
                  additionalProperties: false
                  description: The monetary value in the currency indicated, in ISO 4217 standard format.
                  properties:
                    unit:
                      description: The ISO 4217 format 3-character currency code.
                      maxLength: 3
                      minLength: 3
                      type: string
                    value:
                      description: The monetary value.
                      type: number
                  required:
                  - unit
                  - value
                  type: object
                charge_type:
                  description: 'The type of charge. Values: TAX: A tax imposed on a package; DISCOUNT: A discount deducted from the cost of a package.'
                  enum:
                  - TAX
                  - DISCOUNT
                  type: string
              required: []
              type: object
            type: array
          dimensions:
            additionalProperties: false
            description: A set of measurements for a three-dimensional object.
            properties:
              height:
                description: The height of the package.
                type: number
              length:
                description: The length of the package.
                type: number
              unit:
                description: 'The unit of measurement. Values: INCH: The imperial unit of length equal to one twelfth of a foot; CENTIMETER: A metric unit of length, equal to one hundredth of a meter.'
                enum:
                - INCH
                - CENTIMETER
                type: string
              width:
                description: The width of the package.
                type: number
            required:
            - height
            - length
            - unit
            - width
            type: object
          insured_value:
            additionalProperties: false
            description: The monetary value in the currency indicated, in ISO 4217 standard format.
            properties:
              unit:
                description: The ISO 4217 format 3-character currency code.
                maxLength: 3
                minLength: 3
                type: string
              value:
                description: The monetary value.
                type: number
            required:
            - unit
            - value
            type: object
          is_hazmat:
            description: When true, the package contains hazardous materials. Defaults to false.
            type: boolean
          items:
            description: A list of items.
            items:
              additionalProperties: false
              description: An item in a package.
              properties:
                dangerous_goods_details:
                  additionalProperties: false
                  description: Details related to any dangerous goods/items that are being shipped.
                  properties:
                    packing_group:
                      description: 'The specific packaging group of the item being shipped. Values: I: Packing group I indicates great danger; II: Packing group II indicates medium danger; III: Packing group III indicates minor danger.'
                      enum:
                      - I
                      - II
                      - III
                      type: string
                    packing_instruction:
                      description: 'The specific packing instruction of the item being shipped. Values: PI965_SECTION_IA: Ion PI965 Section IA (LiBa); PI965_SECTION_IB: Ion PI965 Section IB (LiBa); PI965_SECTION_II: Ion PI965 Section II (LiBa); PI966_SECTION_I: Ion PI966 Section I (LiBa with equipment); PI966_SECTION_II: Ion PI966 Section II (LiBa with equipment); PI967_SECTION_I: Ion PI967 Section I (LiBa in equipment); PI967_SECTION_II: Ion PI967 Section II (LiBa in equipment); PI968_SECTION_IA: Metal PI968 Section IA (LiBa); PI968_SECTION_IB: Metal PI968 Section IB (LiBa); PI969_SECTION_I: Metal PI969 Section I (LiBa with equipment); PI969_SECTION_II: Metal PI969 Section II (LiBa with equipment); PI970_SECTION_I: Metal PI970 Section I (LiBa in equipment); PI970_SECTION_II: Metal PI970 Section II (LiBa in equipment).'
                      enum:
                      - PI965_SECTION_IA
                      - PI965_SECTION_IB
                      - PI965_SECTION_II
                      - PI966_SECTION_I
                      - PI966_SECTION_II
                      - PI967_SECTION_I
                      - PI967_SECTION_II
                      - PI968_SECTION_IA
                      - PI968_SECTION_IB
                      - PI969_SECTION_I
                      - PI969_SECTION_II
                      - PI970_SECTION_I
                      - PI970_SECTION_II
                      type: string
                    transportation_regulatory_class:
                      description: 'The specific regulatory class of the item being shipped. Format (checked by Amazon): ^[1-9](\.[1-9])?$'
                      type: string
                    united_nations_regulatory_id:
                      description: 'The specific UNID of the item being shipped. Format (checked by Amazon): ^(UN|ID|NA)[0-9]{4}$'
                      type: string
                  required: []
                  type: object
                description:
                  description: The product description of the item.
                  type: string
                direct_fulfillment_item_identifiers:
                  additionalProperties: false
                  description: Item identifiers for an item in a direct fulfillment shipment.
                  properties:
                    line_item_id:
                      description: A unique identifier for an item provided by the client for a direct fulfillment shipment. This is only populated for direct fulfillment multi-piece shipments. It is required if a vendor wants to change the configuration of the packages in which the purchase order is shipped.
                      type: string
                    piece_number:
                      description: A unique identifier for an item provided by the client for a direct fulfillment shipment. This is only populated if a single line item has multiple pieces. Defaults to 1.
                      type: string
                  required:
                  - line_item_id
                  type: object
                invoice_details:
                  additionalProperties: false
                  description: The invoice details for charges associated with the goods in the package. Only applies to certain regions.
                  properties:
                    invoice_date:
                      description: The invoice date of the item in ISO 8061 format.
                      format: date-time
                      type: string
                    invoice_number:
                      description: The invoice number of the item.
                      type: string
                  required: []
                  type: object
                is_hazmat:
                  description: When true, the item qualifies as hazardous materials (hazmat). Defaults to false.
                  type: boolean
                item_identifier:
                  description: A unique identifier for an item provided by the client.
                  type: string
                item_value:
                  additionalProperties: false
                  description: The monetary value in the currency indicated, in ISO 4217 standard format.
                  properties:
                    unit:
                      description: The ISO 4217 format 3-character currency code.
                      maxLength: 3
                      minLength: 3
                      type: string
                    value:
                      description: The monetary value.
                      type: number
                  required:
                  - unit
                  - value
                  type: object
                liquid_volume:
                  additionalProperties: false
                  description: Liquid Volume.
                  properties:
                    unit:
                      description: 'The unit of measurement. Values: ML: Milliliter - Metric unit of volume; L: Liter - Metric unit of volume; FL_OZ: Fluid Ounce - Imperial unit of volume; GAL: Gallon - Imperial unit of volume; PT: Pint - Imperial unit of volume; QT: Quart - Imperial unit of volume; C: Cup - Imperial unit of volume.'
                      enum:
                      - ML
                      - L
                      - FL_OZ
                      - GAL
                      - PT
                      - QT
                      - C
                      type: string
                    value:
                      description: The measurement value.
                      type: number
                  required:
                  - unit
                  - value
                  type: object
                product_type:
                  description: The product type of the item.
                  type: string
                quantity:
                  description: The number of units. This value is required.
                  type: integer
                serial_numbers:
                  description: A list of unique serial numbers in an Amazon package that can be used to guarantee non-fraudulent items. The number of serial numbers in the list must be less than or equal to the quantity of items being shipped. Only applicable when channel source is Amazon.
                  items:
                    type: string
                  type: array
                weight:
                  additionalProperties: false
                  description: The weight in the units indicated.
                  properties:
                    unit:
                      description: 'The unit of measurement. Values: GRAM: Metric unit of mass equal to one thousandth of a kilogram; KILOGRAM: Metric unit of mass; OUNCE: The imperial unit of weight that is one sixteenth of a pound; POUND: The imperial unit of weight.'
                      enum:
                      - GRAM
                      - KILOGRAM
                      - OUNCE
                      - POUND
                      type: string
                    value:
                      description: The measurement value.
                      type: number
                  required:
                  - unit
                  - value
                  type: object
              required:
              - quantity
              type: object
            type: array
          package_client_reference_id:
            description: A client provided unique identifier for a package being shipped. This value should be saved by the client to pass as a parameter to the getShipmentDocuments operation.
            type: string
          seller_display_name:
            description: The seller name displayed on the label.
            type: string
          weight:
            additionalProperties: false
            description: The weight in the units indicated.
            properties:
              unit:
                description: 'The unit of measurement. Values: GRAM: Metric unit of mass equal to one thousandth of a kilogram; KILOGRAM: Metric unit of mass; OUNCE: The imperial unit of weight that is one sixteenth of a pound; POUND: The imperial unit of weight.'
                enum:
                - GRAM
                - KILOGRAM
                - OUNCE
                - POUND
                type: string
              value:
                description: The measurement value.
                type: number
            required:
            - unit
            - value
            type: object
        required:
        - dimensions
        - insured_value
        - items
        - package_client_reference_id
        - weight
        type: object
      type: array
      title: Package
      maxItems: 1
      examples:
      - - package_client_reference_id: order-123-pkg-1
          dimensions:
            length: 30
            width: 20
            height: 10
            unit: CENTIMETER
          weight:
            value: 1.2
            unit: KILOGRAM
          insured_value:
            value: 25.0
            unit: GBP
          items:
          - item_identifier: '12345678901234'
            quantity: 1
            item_value:
              value: 25.0
              unit: GBP
            description: Blue mug
            weight:
              value: 1.0
              unit: KILOGRAM
