- operation_id: search_reports
  display_name: Find reports
  description: Returns one page of the connection's reports of the given types in its marketplace, including the settlement reports Amazon generates on its own. Amazon keeps reports for 90 days.
  operation_kind: source
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: report_types
    value_type: array
    required: true
    schema:
      type: array
      title: Report types
      description: Report types to find.
      minItems: 1
      items:
        type: string
        enum:
        - GET_V2_SETTLEMENT_REPORT_DATA_FLAT_FILE_V2
        - GET_MERCHANT_LISTINGS_ALL_DATA
        - GET_MERCHANT_LISTINGS_DATA
        - GET_FLAT_FILE_OPEN_LISTINGS_DATA
        - GET_FLAT_FILE_ALL_ORDERS_DATA_BY_ORDER_DATE_GENERAL
        - GET_FLAT_FILE_ALL_ORDERS_DATA_BY_LAST_UPDATE_GENERAL
        - GET_FBA_MYI_UNSUPPRESSED_INVENTORY_DATA
        - GET_FBA_FULFILLMENT_CUSTOMER_RETURNS_DATA
        - GET_FLAT_FILE_RETURNS_DATA_BY_RETURN_DATE
      maxItems: 10
  - name: processing_statuses
    value_type: array
    required: false
    schema:
      type: array
      title: Processing statuses
      description: Only reports in these statuses.
      minItems: 1
      items:
        type: string
        enum:
        - CANCELLED
        - DONE
        - FATAL
        - IN_PROGRESS
        - IN_QUEUE
      maxItems: 5
  - name: created_since
    value_type: text
    required: false
    schema:
      type: string
      title: Created since
      description: 'Reports created at or after this time (default: 90 days ago). ISO 8601 with a time zone, for example 2026-11-01T00:00:00Z.'
      minLength: 1
      maxLength: 40
  - name: created_until
    value_type: text
    required: false
    schema:
      type: string
      title: Created until
      description: 'Reports created before this time (default: now). ISO 8601 with a time zone, for example 2026-11-01T00:00:00Z.'
      minLength: 1
      maxLength: 40
  - name: page_size
    value_type: integer
    required: false
    schema:
      type: integer
      title: Page size
      description: Reports per page, 1 to 100.
      minimum: 1
      maximum: 100
  - name: next_token
    value_type: text
    required: false
    schema:
      type: string
      title: Continuation token
      description: next_token from the previous page of the same search, with the same filters and connection. Leave empty for the first page.
      minLength: 1
      maxLength: 4096
  outputs:
  - name: reports
    value_type: array
    schema:
      type: array
      items:
        type: object
  - name: count
    value_type: integer
    schema:
      type: integer
  - name: next_token
    value_type: text
    schema:
      type:
      - string
      - 'null'
