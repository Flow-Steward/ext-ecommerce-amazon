- operation_id: fba_list_inbound_plans
  display_name: 'FBA: list inbound plans'
  description: 'Lists inbound plans, optionally by status, sorted as asked. Returns one page and next_token; nothing loops over the remaining pages. Availability: Every Amazon marketplace except Brazil, where Amazon does not support inbound shipment creation through the API. Scope: The seller''s data in the connection''s region: the method addresses a resource by its Amazon ID or reads seller-wide data, and Amazon answers for any marketplace of the seller in that region. Check marketplace_ids in the result where it matters.'
  operation_kind: source
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: page_size
    value_type: integer
    required: false
    schema:
      description: How many rows one page returns.
      maximum: 30
      minimum: 1
      type: integer
      title: Page size
  - name: status
    value_type: text
    required: false
    schema:
      description: 'The status of an inbound plan. Values: ACTIVE: An inbound plan that is being worked on; VOIDED: An inbound plan with all shipment cancelled and can no longer be modified; SHIPPED: A completed inbound plan. Only minor modifications can be made at this time.'
      enum:
      - ACTIVE
      - VOIDED
      - SHIPPED
      type: string
      title: Status
  - name: sort_by
    value_type: text
    required: false
    schema:
      description: 'Sort by field. Values: LAST_UPDATED_TIME: Last updated time of the inbound plan; CREATION_TIME: Inbound plan creation time.'
      enum:
      - LAST_UPDATED_TIME
      - CREATION_TIME
      type: string
      title: Sort by
  - name: sort_order
    value_type: text
    required: false
    schema:
      description: 'The sort order. Values: ASC: Ascending order; DESC: Descending order.'
      enum:
      - ASC
      - DESC
      type: string
      title: Sort order
  - name: next_token
    value_type: text
    required: false
    schema:
      type: string
      title: Continuation token
      description: next_token from the previous page of the same search, with the same filters and connection. Leave empty for the first page.
      minLength: 1
      maxLength: 4096
  outputs:
  - name: inbound_plans
    value_type: array
    schema:
      description: A list of inbound plans with minimal information.
      items:
        description: A light-weight inbound plan.
        properties:
          created_at:
            description: The time at which the inbound plan was created. In [ISO 8601](https://developer-docs.amazon.com/sp-api/docs/iso-8601) datetime format with pattern `yyyy-MM-ddTHH:mm:ssZ`.
            format: date-time
            type:
            - string
            - 'null'
          inbound_plan_id:
            description: 'Identifier of an inbound plan. Format (checked by Amazon): ^[a-zA-Z0-9-]*$'
            type:
            - string
            - 'null'
          last_updated_at:
            description: The time at which the inbound plan was last updated. In [ISO 8601](https://developer-docs.amazon.com/sp-api/docs/iso-8601) datetime format with pattern `yyyy-MM-ddTHH:mm:ssZ`.
            format: date-time
            type:
            - string
            - 'null'
          marketplace_ids:
            description: A list of marketplace IDs.
            items:
              description: The Marketplace ID. For a list of possible values, refer to [Marketplace IDs](https://developer-docs.amazon.com/sp-api/docs/marketplace-ids).
              type:
              - string
              - 'null'
            type:
            - array
            - 'null'
          name:
            description: Human-readable name of the inbound plan.
            type:
            - string
            - 'null'
          source_address:
            description: Specific details to identify a place.
            properties:
              address_line1:
                description: Street address information.
                type:
