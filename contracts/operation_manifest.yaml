- operation_id: list_financial_records
  display_name: List financial records
  description: 'Returns one page of financial records posted in a time window: 2024-06-19 transactions (default) or v0 financial events, flattened into one list. Each record has record_type, posted_date, amazon_order_id (when present), amounts (labelled money values, never summed across currencies), origin and Amazon''s object under amazon. v0 events and 2024-06-19 transactions are not interchangeable and share no ID: never mix records of both versions to deduplicate or reconcile. Amazon may take up to 48 hours to post an event, so a window ending now is not complete yet. Scope: The seller''s data in the connection''s region: the method addresses a resource by its Amazon ID or reads seller-wide data, and Amazon answers for any marketplace of the seller in that region. Check marketplace_ids in the result where it matters.'
  operation_kind: source
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: api_version
    value_type: text
    required: false
    schema:
      type: string
      title: Amazon API version
      description: 2024-06-19 (listTransactions, default) or v0 (financial events; Amazon removes listFinancialEvents, listFinancialEventsByGroupId and listFinancialEventsByOrderId on 2027-08-27). The two versions return different records with no shared ID; do not mix them.
      enum:
      - '2024-06-19'
      - v0
  - name: posted_after
    value_type: text
    required: false
    schema:
      type: string
      title: Posted after
      description: Records posted at or after this time; at least two minutes in the past. ISO 8601 with a time zone, for example 2026-11-01T00:00:00Z.
      minLength: 1
      maxLength: 40
  - name: posted_before
    value_type: text
    required: false
    schema:
      type: string
      title: Posted before
      description: 'Records posted before this time (default: two minutes ago). At most 180 days after posted_after. ISO 8601 with a time zone, for example 2026-11-01T00:00:00Z.'
      minLength: 1
      maxLength: 40
  - name: transaction_status
    value_type: text
    required: false
    schema:
      type: string
      title: Transaction status (2024-06-19)
      description: Only transactions in this status.
      enum:
      - DEFERRED
      - RELEASED
      - DEFERRED_RELEASED
  - name: omit_marketplace_filter
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Do not filter by marketplace (2024-06-19)
      description: 'Leave out Amazon''s marketplace filter. Amazon''s own note: to get MFN orders in the US store, do not send the marketplace. Records may then cover other marketplaces of the seller.'
  - name: max_results
    value_type: integer
    required: false
    schema:
      type: integer
      title: Page size (v0)
      description: Events per page, 1 to 100.
      minimum: 1
      maximum: 100
  - name: next_token
    value_type: text
    required: false
    schema:
      type: string
      title: Continuation token
      description: next_token from the previous page of the same search, with the same filters and connection. Leave empty for the first page.
      minLength: 1
      maxLength: 4096
  outputs:
  - name: records
    value_type: array
    schema:
      type: array
      items:
        type: object
  - name: count
    value_type: integer
    schema:
      type: integer
  - name: next_token
    value_type: text
    schema:
      type:
      - string
      - 'null'
  - name: api_version
    value_type: text
    schema:
      type: string
  - name: amazon_operation
    value_type: text
    schema:
      type: string
  result_fields:
  - result.records
  - result.count
  - result.next_token
  - result.api_version
  - result.amazon_operation
