            items:
              description: Information pertaining to the preparation of inbound goods.
              properties:
                fee:
                  description: The type and amount of currency.
                  properties:
                    amount:
                      description: Decimal value of the currency.
                      type:
                      - number
                      - string
                      - 'null'
                    code:
                      description: ISO 4217 standard of a currency code.
                      type:
                      - string
                      - 'null'
                  required:
                  - amount
                  - code
                  type:
                  - object
                  - 'null'
                prep_owner:
                  description: In some situations, special preparations are required for items and this field reflects the owner of the preparations. Options include `AMAZON`, `SELLER` or `NONE`. `AMAZON` is not an accepted value in the US marketplace.
                  type:
                  - string
                  - 'null'
                prep_type:
                  description: 'Type of preparation that should be done. Possible values: `ITEM_LABELING`, `ITEM_BUBBLEWRAP`, `ITEM_POLYBAGGING`, `ITEM_TAPING`, `ITEM_BLACK_SHRINKWRAP`, `ITEM_HANG_GARMENT`, `ITEM_BOXING`, `ITEM_SETCREAT`, `ITEM_RMOVHANG`, `ITEM_SUFFOSTK`, `ITEM_CAP_SEALING`, `ITEM_DEBUNDLE`, `ITEM_SETSTK`, `ITEM_SIOC`, `ITEM_NO_PREP`, `ADULT`, `BABY`, `TEXTILE`, `HANGER`, `FRAGILE`, `LIQUID`, `SHARP`, `SMALL`, `PERFORATED`, `GRANULAR`, `SET`, `FC_PROVIDED`, `UNKNOWN`, `NONE`.'
