- operation_id: confirm_shipment
  display_name: Confirm a shipment
  description: 'Confirms that a package of a merchant-fulfilled order was shipped: carrier, tracking number, ship date and the items with quantities in the package. Amazon answers without the new order state; read the order afterwards. Orders v0 only: Orders 2026-01-01 has no equivalent, and this call is not in Amazon''s v0 deprecation schedule.'
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  effect_kind: amazon_shipment_confirmation
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: order_id
    value_type: text
    required: true
    schema:
      type: string
      title: Amazon order ID
      description: The Amazon order ID, for example 123-1234567-1234567.
      minLength: 1
      maxLength: 64
  - name: package_reference_id
    value_type: text
    required: true
    schema:
      type: string
      title: Package reference ID
      description: Your positive numeric identifier of this package within the order, for example 1.
      minLength: 1
      maxLength: 19
  - name: carrier_code
    value_type: text
    required: true
    schema:
      type: string
      title: Carrier code
      description: Amazon's carrier code, for example UPS, DHL, Royal Mail, or Other with carrier_name.
      minLength: 1
      maxLength: 100
  - name: carrier_name
    value_type: text
    required: false
    schema:
      type: string
      title: Carrier name
      description: Required when carrier_code is Other.
      minLength: 1
      maxLength: 100
  - name: shipping_method
    value_type: text
    required: false
    schema:
      type: string
      title: Shipping method
      description: The ship method, for example Next Day.
      minLength: 1
      maxLength: 100
  - name: tracking_number
    value_type: text
    required: true
    schema:
      type: string
      title: Tracking number
      description: The carrier's tracking number.
      minLength: 1
      maxLength: 100
  - name: ship_date
    value_type: text
    required: true
    schema:
      type: string
      title: Ship date
      description: When the package was shipped. ISO 8601 with a time zone, for example 2026-11-01T00:00:00Z.
      minLength: 1
      maxLength: 40
  - name: ship_from_supply_source_id
    value_type: text
    required: false
    schema:
      type: string
      title: Supply source ID
      description: The supply source the package ships from, if you use supply sources.
      minLength: 1
      maxLength: 128
  - name: items
    value_type: array
    required: true
    schema:
      type: array
      title: Order items
      description: The order items and quantities in this package.
      minItems: 1
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required:
        - order_item_id
        - quantity
        properties:
          order_item_id:
            type: string
            title: Order item ID
            description: The order item ID from get_order_items.
            minLength: 1
            maxLength: 64
          quantity:
            type: integer
            minimum: 1
            maximum: 100000
          transparency_codes:
            type: array
            title: Transparency codes
            description: Amazon Transparency codes for this item, if it needs them.
            minItems: 1
            maxItems: 100
            items:
              type: string
              minLength: 1
              maxLength: 100
  - name: cod_collection_method
    value_type: text
    required: false
    schema:
      type: string
      title: COD collection method
      description: Cash-on-delivery collection method (Japan only).
      enum:
      - DirectPayment
  outputs:
  - name: order_id
    value_type: text
    schema:
      type: string
  - name: confirmed
    value_type: boolean
    schema:
      type: boolean
  - name: package_reference_id
    value_type: text
    schema:
      type: string
  - name: note
    value_type: text
    schema:
      type: string
