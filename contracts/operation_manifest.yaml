              description: The number of the carrier shipment acknowledgement document.
              maxLength: 1024
              minLength: 1
              type: string
            freight_bill_number:
              description: Number associated with the freight bill.
              items:
                description: 'Format (checked by Amazon): ^[a-zA-Z0-9-._ ]*$'
                maxLength: 64
                minLength: 1
                type: string
              maxItems: 1
              minItems: 1
              type: array
