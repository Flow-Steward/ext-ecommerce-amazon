      description: Up to 20 product identifiers.
      minItems: 1
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 200
  - name: identifiers_type
    value_type: text
    required: false
    schema:
      type: string
      title: Identifier type
      description: The type of every value in identifiers.
      enum:
      - ASIN
      - EAN
      - GTIN
      - ISBN
      - JAN
      - MINSAN
      - SKU
      - UPC
  - name: keywords
    value_type: array
    required: false
