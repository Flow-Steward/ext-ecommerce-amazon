- operation_id: update_listing_attributes
  display_name: Update listing attributes
  description: 'Changes selected top-level attributes of an existing listing with JSON Patch operations (add, replace, merge, delete on /attributes/<name>); other attributes stay as they are. Amazon requires the listing''s product_type. Amazon answers ACCEPTED when the submission passed its synchronous checks; it applies the change later (usually within minutes) and may still raise issues, so accepted is not applied: read the listing with get_listing to confirm. INVALID means Amazon refused it and nothing changed (accepted false, external_effect_status failed).'
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  effect_kind: amazon_listing_patch
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: sku
    value_type: text
    required: true
    schema:
      type: string
      title: SKU
      description: Your seller SKU. Any character is allowed; it is sent percent-encoded.
      minLength: 1
      maxLength: 200
  - name: product_type
    value_type: text
    required: true
    schema:
      type: string
      title: Amazon product type
      description: The Amazon product type of the listing, for example LUGGAGE (see search_product_types). Amazon requires it for every listing submission.
      minLength: 1
      maxLength: 100
  - name: patches
    value_type: array
    required: true
    schema:
      type: array
      title: Patches
      description: 'JSON Patch operations on top-level attributes: op add, replace, merge or delete; path /attributes/<attribute name>; value a list of attribute values (optional for delete). merge works only for purchasable_offer and fulfillment_availability.'
      minItems: 1
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required:
