  display_name: 'FBA: set shipment tracking'
  description: 'Sends the tracking of a shipment sent with the seller''s own carrier: per box tracking IDs for small parcel, or the bill of lading and freight bill numbers for LTL/FTL. Availability: Every Amazon marketplace except Brazil, where Amazon does not support inbound shipment creation through the API. Scope: The seller''s data in the connection''s region: the method addresses a resource by its Amazon ID or reads seller-wide data, and Amazon answers for any marketplace of the seller in that region. Check marketplace_ids in the result where it matters.'
