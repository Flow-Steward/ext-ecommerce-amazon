      description: Up to 20 search keywords.
      minItems: 1
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 200
  - name: brand_names
    value_type: array
    required: false
    schema:
      type: array
      title: Brands
      description: 'Keyword search only: limit to these brands.'
      minItems: 1
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 200
  - name: classification_ids
    value_type: array
    required: false
    schema:
      type: array
      title: Classification IDs
      description: 'Keyword search only: limit to these browse classifications.'
      minItems: 1
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 64
  - name: keywords_locale
    value_type: text
    required: false
    schema:
      type: string
      title: Keywords language
      description: 'Keyword search only: the language of the keywords.'
      minLength: 1
      maxLength: 10
  - name: included_data
    value_type: array
    required: false
    schema:
