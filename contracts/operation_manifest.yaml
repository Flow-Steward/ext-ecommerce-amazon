- operation_id: set_price
  display_name: Set a price
  description: 'Sets the price (including tax where applicable) of the seller''s offer for a SKU in the connection''s marketplace, and optionally the business (B2B) price. Only the purchasable_offer attribute is sent, merged by marketplace, currency and audience, so nothing else on the listing changes. currency_code must be the marketplace currency. Amazon answers ACCEPTED when the submission passed its synchronous checks; it applies the change later (usually within minutes) and may still raise issues, so accepted is not applied: read the listing with get_listing to confirm. INVALID means Amazon refused it and nothing changed (accepted false, external_effect_status failed).'
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  effect_kind: amazon_price_update
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: sku
    value_type: text
    required: true
    schema:
      type: string
      title: SKU
      description: Your seller SKU. Any character is allowed; it is sent percent-encoded.
      minLength: 1
      maxLength: 200
  - name: product_type
    value_type: text
    required: true
    schema:
      type: string
      title: Amazon product type
      description: The Amazon product type of the listing, for example LUGGAGE (see search_product_types). Amazon requires it for every listing submission.
      minLength: 1
      maxLength: 100
  - name: price
    value_type: text
    required: true
    schema:
      type: string
      title: Price
      description: The new price as a decimal string, for example "19.99".
      minLength: 1
      maxLength: 24
  - name: currency_code
    value_type: text
    required: true
    schema:
      type: string
      title: Currency
      description: ISO 4217 code of the marketplace currency, for example GBP.
      minLength: 3
      maxLength: 3
  - name: business_price
    value_type: text
    required: false
    schema:
      type: string
      title: Business price
      description: Optional B2B price as a decimal string (Amazon Business sellers).
      minLength: 1
      maxLength: 24
  - name: issue_locale
    value_type: text
    required: false
    schema:
      type: string
      title: Issue language
      description: Locale for issue messages, for example en_US or de_DE. Defaults to the marketplace language.
      minLength: 2
      maxLength: 5
  outputs:
  - name: sku
    value_type: text
    schema:
      type: string
  - name: submission_id
    value_type: text
    schema:
      type:
      - string
      - 'null'
  - name: status
    value_type: text
    schema:
      type: string
  - name: accepted
    value_type: boolean
    schema:
      type: boolean
  - name: applied
    value_type: boolean
    schema:
      type: boolean
  - name: check_with
    value_type: text
    schema:
      type: string
  - name: issues
    value_type: array
    schema:
      type: array
      items:
        type: object
  - name: amazon
    value_type: object
    schema:
      type: object
  result_fields:
