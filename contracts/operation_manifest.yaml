- operation_id: get_fba_inventory
  display_name: Get FBA inventory
  description: 'Returns FBA inventory summaries for the connection''s marketplace with every quantity category kept separate: fulfillable, inbound (working, shipped, receiving), reserved, researching and unfulfillable, each broken down. A quantity Amazon does not send is null. Filter by up to 50 SKUs or by start_date_time (changes since then; inbound changes are not detected), not both. Amazon''s page token expires 30 seconds after it is issued.'
  operation_kind: source
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: seller_skus
    value_type: array
    required: false
    schema:
      type: array
      title: SKUs
      description: Up to 50 seller SKUs.
      minItems: 1
      maxItems: 50
      items:
        type: string
        minLength: 1
        maxLength: 200
  - name: start_date_time
    value_type: text
    required: false
    schema:
      type: string
      title: Changed since
      description: Only summaries changed since this time (at most 18 months ago). ISO 8601 with a time zone, for example 2026-11-01T00:00:00Z.
      minLength: 1
      maxLength: 40
  - name: next_token
    value_type: text
    required: false
    schema:
      type: string
      title: Continuation token
      description: next_token from the previous page of the same search, with the same filters and connection. Leave empty for the first page.
      minLength: 1
      maxLength: 4096
  outputs:
  - name: summaries
    value_type: array
    schema:
      type: array
      items:
        type: object
  - name: count
    value_type: integer
    schema:
      type: integer
  - name: next_token
    value_type: text
    schema:
      type:
      - string
      - 'null'
