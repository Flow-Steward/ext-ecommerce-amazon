                    minLength: 1
                    type: string
                required:
                - box_id
                - tracking_id
                type: object
                examples:
                - box_id: FBA10ABC0YY100001
                  tracking_id: FBA10002000
              type: array
          required:
          - spd_tracking_items
          type: object
          examples:
          - spd_tracking_items:
            - box_id: FBA10ABC0YY100001
              tracking_id: FBA10002000
      required: []
      type: object
