  - name: content_type
    value_type: text
    schema:
      type: string
  - name: filename
    value_type: text
    schema:
      type: string
  - name: report_type
    value_type: text
    schema:
      type: string
  - name: report_id
    value_type: text
    schema:
      type: string
  - name: report_document_id
    value_type: text
    schema:
      type: string
  - name: was_compressed
    value_type: boolean
    schema:
      type: boolean
  - name: contains_pii
    value_type: boolean
    schema:
      type: boolean
