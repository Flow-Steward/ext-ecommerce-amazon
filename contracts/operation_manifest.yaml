- operation_id: validate_listing
  display_name: Validate a listing (dry run)
  description: 'Sends the same request as create_listing (request_kind put) or update_listing_attributes (request_kind patch) in Amazon''s VALIDATION_PREVIEW mode: Amazon checks it and reports VALID or INVALID with issues, and changes nothing.'
  operation_kind: source
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: sku
    value_type: text
    required: true
    schema:
      type: string
      title: SKU
      description: Your seller SKU. Any character is allowed; it is sent percent-encoded.
      minLength: 1
      maxLength: 200
  - name: request_kind
    value_type: text
    required: true
    schema:
      type: string
      title: Request kind
      description: put = create_listing, patch = update_listing_attributes.
      enum:
      - put
      - patch
  - name: listing_kind
    value_type: text
    required: false
    schema:
      type: string
      title: Listing kind
      description: 'offer_on_existing_asin: sell an existing Amazon catalog product (offer only). new_product: create the product and the offer (Amazon may refuse to create a new ASIN without brand registry or GTIN approval).'
      enum:
      - offer_on_existing_asin
      - new_product
  - name: asin
    value_type: text
    required: false
    schema:
      type: string
      title: ASIN
      description: The 10-character Amazon Standard Identification Number.
      minLength: 10
      maxLength: 10
  - name: condition_type
    value_type: text
    required: false
    schema:
      type: string
      title: Condition
      description: The item condition of the offer.
      enum:
      - new_new
      - new_open_box
      - new_oem
      - refurbished_refurbished
      - used_like_new
      - used_very_good
      - used_good
      - used_acceptable
      - collectible_like_new
      - collectible_very_good
      - collectible_good
      - collectible_acceptable
      - club_club
  - name: product_type
    value_type: text
    required: false
    schema:
      type: string
      title: Amazon product type
      description: The Amazon product type of the listing, for example LUGGAGE (see search_product_types). Amazon requires it for every listing submission.
      minLength: 1
      maxLength: 100
  - name: attributes
    value_type: object
    required: false
    schema:
      type: object
      title: Attributes
      description: 'Listing attributes keyed by Amazon attribute name, each a list of values as the product type definition describes them, for example {"item_name": [{"value": "Mug", "language_tag": "en_GB"}]}. A marketplace_id inside a value must be the connection''s.'
  - name: patches
    value_type: array
    required: false
    schema:
      type: array
      title: Patches
      description: 'JSON Patch operations on top-level attributes: op add, replace, merge or delete; path /attributes/<attribute name>; value a list of attribute values (optional for delete). merge works only for purchasable_offer and fulfillment_availability.'
      minItems: 1
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required:
        - op
        - path
        properties:
          op:
            type: string
            enum:
            - add
            - replace
            - merge
            - delete
          path:
            type: string
            minLength: 13
            maxLength: 112
          value:
            type: array
            maxItems: 200
            items:
              type: object
  - name: issue_locale
    value_type: text
    required: false
    schema:
      type: string
      title: Issue language
      description: Locale for issue messages, for example en_US or de_DE. Defaults to the marketplace language.
      minLength: 2
      maxLength: 5
  outputs:
  - name: sku
    value_type: text
    schema:
      type: string
  - name: status
    value_type: text
    schema:
      type: string
  - name: valid
    value_type: boolean
    schema:
      type: boolean
  - name: issues
    value_type: array
    schema:
      type: array
      items:
        type: object
  - name: asin
    value_type: text
    schema:
      type:
      - string
      - 'null'
  - name: amazon
    value_type: object
    schema:
      type: object
  result_fields:
  - result.sku
  - result.status
  - result.valid
  - result.issues
  - result.asin
  - result.amazon
