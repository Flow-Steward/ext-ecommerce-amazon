          op:
            type: string
            enum:
            - add
            - replace
            - merge
            - delete
          path:
            type: string
            minLength: 13
            maxLength: 112
          value:
            type: array
            maxItems: 200
            items:
              type: object
  - name: issue_locale
    value_type: text
    required: false
    schema:
      type: string
      title: Issue language
      description: Locale for issue messages, for example en_US or de_DE. Defaults to the marketplace language.
      minLength: 2
      maxLength: 5
  outputs:
