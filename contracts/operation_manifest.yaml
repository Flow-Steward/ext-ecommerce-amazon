- operation_id: create_listing
  display_name: Create or replace a listing
  description: 'Creates a listing for a SKU, or fully replaces an existing one (attributes left out are dropped). offer_on_existing_asin sells an existing catalog product: give asin and the offer attributes (price, quantity, condition); it is sent as LISTING_OFFER_ONLY with the ASIN as merchant_suggested_asin. new_product creates the product too (requirements LISTING): give product_type and all required attributes; Amazon may refuse to create a new ASIN without brand registry or GTIN approval. Check eligibility with check_listing_restrictions and try validate_listing first. Amazon answers ACCEPTED when the submission passed its synchronous checks; it applies the change later (usually within minutes) and may still raise issues, so accepted is not applied: read the listing with get_listing to confirm. INVALID means Amazon refused it and nothing changed (accepted false, external_effect_status failed).'
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  effect_kind: amazon_listing_put
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: sku
    value_type: text
    required: true
    schema:
      type: string
      title: SKU
      description: Your seller SKU. Any character is allowed; it is sent percent-encoded.
      minLength: 1
      maxLength: 200
  - name: listing_kind
    value_type: text
    required: true
    schema:
      type: string
      title: Listing kind
      description: 'offer_on_existing_asin: sell an existing Amazon catalog product (offer only). new_product: create the product and the offer (Amazon may refuse to create a new ASIN without brand registry or GTIN approval).'
      enum:
      - offer_on_existing_asin
      - new_product
  - name: asin
    value_type: text
    required: false
    schema:
      type: string
      title: ASIN
      description: The 10-character Amazon Standard Identification Number.
      minLength: 10
      maxLength: 10
  - name: condition_type
    value_type: text
    required: false
    schema:
      type: string
      title: Condition
      description: The item condition of the offer.
      enum:
      - new_new
      - new_open_box
      - new_oem
      - refurbished_refurbished
      - used_like_new
      - used_very_good
      - used_good
      - used_acceptable
      - collectible_like_new
      - collectible_very_good
      - collectible_good
      - collectible_acceptable
      - club_club
  - name: product_type
    value_type: text
    required: false
    schema:
      type: string
      title: Amazon product type
      description: The Amazon product type of the listing, for example LUGGAGE (see search_product_types). Amazon requires it for every listing submission.
      minLength: 1
      maxLength: 100
  - name: attributes
    value_type: object
    required: true
    schema:
      type: object
      title: Attributes
      description: 'Listing attributes keyed by Amazon attribute name, each a list of values as the product type definition describes them, for example {"item_name": [{"value": "Mug", "language_tag": "en_GB"}]}. A marketplace_id inside a value must be the connection''s.'
  - name: issue_locale
    value_type: text
    required: false
    schema:
      type: string
      title: Issue language
      description: Locale for issue messages, for example en_US or de_DE. Defaults to the marketplace language.
      minLength: 2
      maxLength: 5
  outputs:
  - name: sku
    value_type: text
    schema:
      type: string
  - name: submission_id
    value_type: text
    schema:
      type:
      - string
      - 'null'
  - name: status
    value_type: text
    schema:
      type: string
  - name: accepted
    value_type: boolean
    schema:
      type: boolean
  - name: applied
    value_type: boolean
    schema:
      type: boolean
  - name: check_with
    value_type: text
    schema:
      type: string
  - name: issues
    value_type: array
    schema:
      type: array
      items:
        type: object
  - name: amazon
    value_type: object
    schema:
      type: object
  result_fields:
  - result.sku
  - result.submission_id
  - result.status
  - result.accepted
  - result.applied
  - result.check_with
  - result.issues
