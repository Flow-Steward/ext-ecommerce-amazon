  display_name: Search the Amazon catalog
  description: Finds products in the Amazon catalog of the connection's marketplace, either by up to 20 identifiers of one type (ASIN, EAN, GTIN, ISBN, JAN, MINSAN, SKU, UPC) or by keywords. Pass next_token for the next page.
