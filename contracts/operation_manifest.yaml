  display_name: Get product type requirements
  description: 'Returns a product type''s definition for the connection''s marketplace: version, property groups and the link to its JSON Schema (without the signed query string). include_schema also downloads the schema (up to 2.5 MB) and returns it parsed; parentage_level and requirements make it smaller, and a larger schema is refused with response_too_large.'
  operation_kind: source
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
