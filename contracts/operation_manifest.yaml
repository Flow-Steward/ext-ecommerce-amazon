    required: true
  - name: feed_id
    value_type: text
    required: true
    schema:
      type: string
      title: Feed ID
      description: The feed_id create_feed returned.
      minLength: 1
      maxLength: 64
  - name: save_report_file
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Save the report as a file
      description: Also store Amazon's full processing report as a JSON file.
  outputs:
