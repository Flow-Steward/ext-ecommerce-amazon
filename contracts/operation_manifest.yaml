- operation_id: purchase_shipping_shipment
  display_name: Purchase a shipping label
  description: 'Buys the offer named by request_token and rate_id. Amazon charges the seller''s account the offer''s total_charge. Returns shipment_id and, per package, the tracking ID and which documents exist; store a document with get_shipping_documents. Never re-quotes an expired offer and never repeats a purchase. Availability: Amazon Shipping v2 labels for Amazon orders: United States, United Kingdom, Italy, France and Spain only. The package ships from the marketplace''s own country. Scope: The seller''s labels in the Amazon Shipping business of the connection''s country (sent as x-amzn-shipping-business-id).'
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  effect_kind: amazon_shipping_label_purchase
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: additional_inputs
    value_type: object
    required: false
    schema:
      additionalProperties: {}
      description: 'Only when the rate requires them: the values get_shipping_additional_inputs asks for, with exactly the keys of its schema.'
      type: object
      title: Additional inputs
  - name: rate_id
    value_type: text
    required: true
    schema:
      description: rate_id of the chosen offer.
      type: string
      title: Rate ID
  - name: request_token
    value_type: text
    required: true
    schema:
      description: request_token from get_shipping_rates (not an access token).
      type: string
      title: Request token
  - name: requested_document_specification
    value_type: object
    required: true
    schema:
      additionalProperties: false
      description: 'One of the supported_document_specifications of the chosen rate: format PDF, PNG or ZPL, size, dpi (ZPL only: 203 or 300), page layout, file joining and the document types. A specification the rate does not offer is refused by Amazon.'
      properties:
        dpi:
          description: The dots per inch (DPI) value used in printing. This value represents a measure of the resolution of the document.
          type: integer
        format:
          description: 'The file format of the document. Values: PDF: The Portable Document Format (PDF) file format. Used to present documents, including text formatting and images, in a manner independent of application software, hardware, and operating systems; PNG: Portable Network Graphics (PNG) is a raster-graphics file format that supports lossless data compression; ZPL: Zebra Programming Language (ZPL) format is from Zebra Technologies. It''s used primarily for labeling applications and can only be used with ZPL compatible printers.'
          enum:
          - PDF
          - PNG
          - ZPL
          type: string
        need_file_joining:
          description: When true, files should be stitched together. Otherwise, files should be returned separately. Defaults to false.
          type: boolean
        page_layout:
          description: Indicates the position of the label on the paper. Should be the same value as returned in getRates response.
          type: string
        requested_document_types:
          description: A list of the document types requested.
          items:
            description: 'The type of shipping document. Values: PACKSLIP: A listing of the items packed within the shipment; LABEL: The shipping label for the specific shipment; RECEIPT: The receipt of the shipment; CUSTOM_FORM: The customs documentation for a cross-border shipment.'
            enum:
            - PACKSLIP
            - LABEL
            - RECEIPT
            - CUSTOM_FORM
            type: string
          type: array
        requested_label_customization:
          additionalProperties: false
          description: Object contains customised data requested by a shipper to be printed on a shipping label.
          properties:
            request_attributes:
              description: Specify the type of attributes to be added on a label.
              items:
                description: 'Enumerates the attributes supported to be printed on a shipping label. The values for these attributes are retrieved from GetRates/OneClickShipment request Values: PACKAGE_CLIENT_REFERENCE_ID: Prints client reference ID on the shipping label; SELLER_DISPLAY_NAME: Prints seller name on the shipping label; COLLECT_ON_DELIVERY_AMOUNT: Prints Collect On Delivery amount on the shipping label.'
                enum:
                - PACKAGE_CLIENT_REFERENCE_ID
                - SELLER_DISPLAY_NAME
                - COLLECT_ON_DELIVERY_AMOUNT
                type: string
              type: array
          required: []
          type: object
        size:
          additionalProperties: false
          description: The size dimensions of the label.
          properties:
            length:
              description: The length of the document measured in the units specified.
              type: number
            unit:
              description: 'The unit of measurement. Values: INCH: The imperial unit of length equal to one twelfth of a foot; CENTIMETER: A metric unit of length, equal to one hundredth of a meter.'
              enum:
              - INCH
              - CENTIMETER
              type: string
            width:
              description: The width of the document measured in the units specified.
              type: number
          required:
          - length
          - unit
          - width
          type: object
      required:
      - format
      - need_file_joining
      - requested_document_types
      - size
      type: object
      title: Label format
      examples:
      - format: PDF
        size:
          width: 4
          length: 6
          unit: INCH
        need_file_joining: false
        requested_document_types:
        - LABEL
  - name: requested_value_added_services
    value_type: array
    required: false
    schema:
      description: The value-added services to be added to a shipping service purchase.
      items:
        additionalProperties: false
        description: A value-added service to be applied to a shipping service purchase.
        properties:
          id:
            description: The identifier of the selected value-added service. Must be among those returned in the response to the getRates operation.
            type: string
        required:
