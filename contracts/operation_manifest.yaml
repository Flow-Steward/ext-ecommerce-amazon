- operation_id: fba_generate_placement_options
  display_name: 'FBA: generate placement options'
  description: 'Asks Amazon for the ways the plan''s shipments can be split across fulfillment centres. custom_placement names fulfillment centres where Amazon allows it (for example India). Availability: Every Amazon marketplace except Brazil, where Amazon does not support inbound shipment creation through the API. Scope: The seller''s data in the connection''s region: the method addresses a resource by its Amazon ID or reads seller-wide data, and Amazon answers for any marketplace of the seller in that region. Check marketplace_ids in the result where it matters.'
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  effect_kind: amazon_fba_placement_options_generation
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: inbound_plan_id
    value_type: text
    required: true
    schema:
      description: inbound_plan_id from fba_create_inbound_plan or fba_list_inbound_plans (wf…).
      maxLength: 38
      minLength: 38
      type: string
      title: Inbound plan ID
  - name: custom_placement
    value_type: array
    required: false
    schema:
      description: Custom placement options you want to add to the plan. This is only used for the India (IN - A21TJRUUN4KGV) marketplace.
      items:
        additionalProperties: false
        description: Provide units going to the warehouse.
        properties:
          items:
            description: Items included while creating Inbound Plan.
            items:
              additionalProperties: false
              description: Defines an item's input parameters.
              properties:
                expiration:
                  description: 'The expiration date of the MSKU. In [ISO 8601](https://developer-docs.amazon.com/sp-api/docs/iso-8601) datetime format with pattern `YYYY-MM-DD`. Items with the same MSKU but different expiration dates cannot go into the same box. Format (checked by Amazon): ^([0-9]{4})-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])$'
                  type: string
                label_owner:
                  description: 'Specifies who will label the items. Options include `AMAZON`, `SELLER` or `NONE`. `AMAZON` is not an accepted value in the US marketplace. Values: AMAZON: Amazon provides the information; SELLER: Seller provides the information; NONE: No owner is required for the labelling.'
                  enum:
                  - AMAZON
                  - SELLER
                  - NONE
                  type: string
                manufacturing_lot_code:
                  description: The manufacturing lot code.
                  maxLength: 256
                  minLength: 1
                  type: string
                msku:
                  description: The merchant SKU, a merchant-supplied identifier of a specific SKU.
                  maxLength: 255
                  minLength: 1
                  type: string
                prep_owner:
                  description: 'The owner of the preparations, if special preparations are required. Values: AMAZON: Amazon provides the information; SELLER: The seller provides the information; NONE: No owner is required for the preparations.'
                  enum:
                  - AMAZON
                  - SELLER
                  - NONE
                  type: string
                quantity:
                  description: The number of units of the specified MSKU that will be shipped.
                  maximum: 500000
                  minimum: 1
                  type: integer
              required:
              - label_owner
              - msku
              - prep_owner
              - quantity
              type: object
              examples:
              - expiration: '2024-01-01'
                label_owner: AMAZON
                manufacturing_lot_code: manufacturingLotCode
                msku: Sunglasses
                prep_owner: AMAZON
                quantity: 10
            maxItems: 2000
            minItems: 1
            type: array
          warehouse_id:
            description: Warehouse Id.
            maxLength: 1024
            minLength: 1
            type: string
        required:
        - items
        - warehouse_id
        type: object
        examples:
        - items:
          - expiration: '2024-01-01'
            label_owner: AMAZON
            manufacturing_lot_code: manufacturingLotCode
            msku: Sunglasses
            prep_owner: AMAZON
            quantity: 10
          warehouse_id: YYZ14
      type: array
      title: Custom placement
