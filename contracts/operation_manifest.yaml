- operation_id: get_shipping_tracking
  display_name: Get shipment tracking
  description: 'Reads the tracking of one package: status summary, promised delivery date and the event history. Changes nothing on the order or the shipment. Availability: Amazon Shipping v2 labels for Amazon orders: United States, United Kingdom, Italy, France and Spain only. The package ships from the marketplace''s own country. Scope: The seller''s labels in the Amazon Shipping business of the connection''s country (sent as x-amzn-shipping-business-id).'
  operation_kind: source
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: tracking_id
    value_type: text
    required: true
    schema:
      description: tracking_id from the purchase.
      type: string
      title: Tracking ID
  - name: carrier_id
    value_type: text
    required: true
    schema:
      description: carrier_id of the purchased rate.
      type: string
      title: Carrier ID
  outputs:
  - name: alternate_leg_tracking_id
    value_type: text
    schema:
      description: The carrier generated reverse identifier for a returned package in a purchased shipment.
      type:
      - string
      - 'null'
  - name: event_history
    value_type: array
    schema:
      description: A list of tracking events.
      items:
        description: A tracking event.
        properties:
          event_code:
            description: 'The tracking event type. Values: ReadyForReceive: Package has been created and is ready for pickup at the shippers location. This is a pre-transit status event code; PickupDone: Package has been picked up by the service provider; Delivered: Package has been delivered; Departed: Package has departed from a particular location in carrier network; DeliveryAttempted: Delivery was attempted, but was unsuccessful; Lost: Package is lost; OutForDelivery: Package is out for delivery; ArrivedAtCarrierFacility: Package is in transit and has been received at a carrier location; Rejected: Package was rejected by the recipient; Undeliverable: Package is undeliverable; PickupCancelled: Pickup scheduled for the package was cancelled; ReturnInitiated: Return label has been generated; AvailableForPickup: Package held for recipient pickup; RecipientRequestedAlternateDeliveryTiming: Recipient has requested an update to their delivery date.'
            type:
            - string
            - 'null'
          event_time:
            description: The ISO 8601 formatted timestamp of the event.
            format: date-time
            type:
            - string
            - 'null'
          location:
            description: The location where the person, business or institution is located.
            properties:
              city:
                description: The city or town where the person, business or institution is located.
                type:
                - string
                - 'null'
              country_code:
                description: The two digit country code. Follows ISO 3166-1 alpha-2 format.
                type:
                - string
                - 'null'
              postal_code:
                description: The postal code of that address. It contains a series of letters or digits or both, sometimes including spaces or punctuation.
                type:
                - string
                - 'null'
              state_or_region:
                description: The state, county or region where the person, business or institution is located.
                type:
                - string
                - 'null'
            required: []
            type:
            - object
            - 'null'
          shipment_type:
            description: 'Shipment type. Values: FORWARD: Additional information about shipment representing package journey from origin address to destination address in the transportation/shipping request; RETURNS: Additional information about shipment representing package journey from destination address to origin/return address in the original transportation/shipping request.'
            type:
            - string
            - 'null'
        required:
        - event_code
        - event_time
        type:
        - object
        - 'null'
      type:
      - array
      - 'null'
  - name: promised_delivery_date
    value_type: text
    schema:
      description: The date and time by which the shipment is promised to be delivered.
      format: date-time
      type:
      - string
      - 'null'
  - name: summary
    value_type: object
    schema:
      description: A package status summary.
      properties:
        status:
