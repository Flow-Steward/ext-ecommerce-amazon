    value_type: text
    schema:
      type:
      - string
      - 'null'
  - name: requirements_enforced
    value_type: text
    schema:
      type:
      - string
      - 'null'
  - name: locale
    value_type: text
    schema:
      type:
      - string
      - 'null'
  - name: marketplace_ids
    value_type: array
    schema:
      type: array
