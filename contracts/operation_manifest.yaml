  description: 'Cancels a requested report that Amazon has not started processing (status IN_QUEUE). The nine supported report types and download_report are unchanged. Scope: The seller''s data in the connection''s region: the method addresses a resource by its Amazon ID or reads seller-wide data, and Amazon answers for any marketplace of the seller in that region. Check marketplace_ids in the result where it matters.'
