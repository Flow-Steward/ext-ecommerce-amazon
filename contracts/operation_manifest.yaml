- operation_id: fba_create_inbound_plan
  display_name: 'FBA: create inbound plan'
  description: 'Creates an inbound plan for the connection''s marketplace from the MSKUs and quantities to send and the address they ship from. Returns inbound_plan_id and operation_id at once; the plan is usable after the operation succeeded. Availability: Every Amazon marketplace except Brazil, where Amazon does not support inbound shipment creation through the API.'
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  effect_kind: amazon_fba_inbound_plan_creation
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: items
    value_type: array
    required: true
    schema:
      description: MSKUs, quantities and who preps and labels them.
      items:
        additionalProperties: false
        description: Defines an item's input parameters.
        properties:
          expiration:
            description: 'The expiration date of the MSKU. In [ISO 8601](https://developer-docs.amazon.com/sp-api/docs/iso-8601) datetime format with pattern `YYYY-MM-DD`. Items with the same MSKU but different expiration dates cannot go into the same box. Format (checked by Amazon): ^([0-9]{4})-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])$'
            type: string
          label_owner:
            description: 'Specifies who will label the items. Options include `AMAZON`, `SELLER` or `NONE`. `AMAZON` is not an accepted value in the US marketplace. Values: AMAZON: Amazon provides the information; SELLER: Seller provides the information; NONE: No owner is required for the labelling.'
            enum:
            - AMAZON
            - SELLER
            - NONE
            type: string
          manufacturing_lot_code:
            description: The manufacturing lot code.
            maxLength: 256
            minLength: 1
            type: string
          msku:
            description: The merchant SKU, a merchant-supplied identifier of a specific SKU.
            maxLength: 255
            minLength: 1
            type: string
          prep_owner:
            description: 'The owner of the preparations, if special preparations are required. Values: AMAZON: Amazon provides the information; SELLER: The seller provides the information; NONE: No owner is required for the preparations.'
            enum:
            - AMAZON
            - SELLER
            - NONE
            type: string
          quantity:
            description: The number of units of the specified MSKU that will be shipped.
            maximum: 500000
            minimum: 1
            type: integer
        required:
        - label_owner
        - msku
        - prep_owner
        - quantity
        type: object
        examples:
        - expiration: '2024-01-01'
          label_owner: AMAZON
          manufacturing_lot_code: manufacturingLotCode
          msku: Sunglasses
          prep_owner: AMAZON
          quantity: 10
      maxItems: 2000
      minItems: 1
      type: array
      title: Items
      examples:
      - - msku: MUG-BLUE-01
          quantity: 24
          prep_owner: SELLER
          label_owner: SELLER
  - name: name
    value_type: text
    required: false
    schema:
      description: Name for the Inbound Plan. If one isn't provided, a default name will be provided.
      maxLength: 40
      minLength: 1
      type: string
      title: Plan name
  - name: source_address
    value_type: object
    required: true
    schema:
      additionalProperties: false
      description: Specific details to identify a place.
      properties:
        address_line1:
          description: Street address information.
          maxLength: 180
          minLength: 1
          type: string
        address_line2:
          description: Additional street address information.
          maxLength: 60
          minLength: 1
          type: string
        city:
          description: The city.
          maxLength: 30
          minLength: 1
          type: string
        company_name:
          description: The name of the business.
          maxLength: 50
          minLength: 1
          type: string
        country_code:
          description: 'The country code in two-character ISO 3166-1 alpha-2 format. Format (checked by Amazon): ^[A-Z]{2}$'
          maxLength: 2
          minLength: 2
          type: string
        district_or_county:
          description: The district or county.
          maxLength: 50
          minLength: 1
          type: string
        email:
          description: The email address.
          maxLength: 1024
          minLength: 1
          type: string
        name:
          description: The name of the individual who is the primary contact.
          maxLength: 50
          minLength: 1
          type: string
        phone_number:
          description: The phone number.
          maxLength: 20
          minLength: 1
          type: string
        postal_code:
          description: The postal code.
          maxLength: 32
          minLength: 1
          type: string
        state_or_province_code:
          description: The state or province code.
          maxLength: 64
          minLength: 1
          type: string
      required:
      - address_line1
      - city
      - country_code
      - name
      - phone_number
      - postal_code
      type: object
      examples:
      - name: Warehouse 1
        company_name: Example Ltd
        address_line1: 1 Example Street
        city: Seattle
        state_or_province_code: WA
        postal_code: '98101'
        country_code: US
        phone_number: '+12065550100'
        email: warehouse@example.com
      title: Ship-from address
  outputs:
