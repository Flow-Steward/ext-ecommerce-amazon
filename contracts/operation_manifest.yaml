                - code
                type:
                - object
                - 'null'
              expiration:
                description: The time at which this transportation option quote expires. In [ISO 8601](https://developer-docs.amazon.com/sp-api/docs/iso-8601) datetime with pattern `yyyy-MM-ddTHH:mm:ss.sssZ`.
                format: date-time
                type:
                - string
                - 'null'
              voidable_until:
                description: Voidable until timestamp.
                format: date-time
                type:
                - string
                - 'null'
            required:
            - cost
            type:
            - object
            - 'null'
          shipment_id:
            description: 'Identifier of a shipment. A shipment contains the boxes and units being inbounded. Format (checked by Amazon): ^[a-zA-Z0-9-]*$'
            type:
            - string
            - 'null'
          shipping_mode:
