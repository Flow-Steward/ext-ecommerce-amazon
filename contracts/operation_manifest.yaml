- operation_id: download_report
  display_name: Download a report
  description: 'Downloads a finished report (up to 100 MB compressed, 200 MB uncompressed) and stores it as a file. Give the report_id from search_reports, create_report or get_report; the report''s type is read from Amazon and must be one of the supported types. The report is not parsed. Supported types: GET_V2_SETTLEMENT_REPORT_DATA_FLAT_FILE_V2, GET_MERCHANT_LISTINGS_ALL_DATA, GET_MERCHANT_LISTINGS_DATA, GET_FLAT_FILE_OPEN_LISTINGS_DATA, GET_FLAT_FILE_ALL_ORDERS_DATA_BY_ORDER_DATE_GENERAL, GET_FLAT_FILE_ALL_ORDERS_DATA_BY_LAST_UPDATE_GENERAL, GET_FBA_MYI_UNSUPPRESSED_INVENTORY_DATA, GET_FBA_FULFILLMENT_CUSTOMER_RETURNS_DATA, GET_FLAT_FILE_RETURNS_DATA_BY_RETURN_DATE. Scope: The seller''s data in the connection''s region: the method addresses a resource by its Amazon ID or reads seller-wide data, and Amazon answers for any marketplace of the seller in that region. Check marketplace_ids in the result where it matters.'
  operation_kind: source
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: report_id
    value_type: text
    required: true
    schema:
      type: string
      title: Report ID
      description: The report_id create_report or search_reports returned.
      minLength: 1
      maxLength: 64
  outputs:
  - name: artifact_handle
    value_type: text
    schema:
      type: string
  - name: size_bytes
    value_type: integer
    schema:
      type: integer
  - name: sha256
    value_type: text
    schema:
