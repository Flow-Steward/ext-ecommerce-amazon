- operation_id: fba_confirm_transportation_options
  display_name: 'FBA: confirm transportation options'
  description: 'Confirms one transportation option per shipment, as the workflow chose them. For an Amazon-partnered carrier this authorizes Amazon to charge the seller''s account the transportation option''s quote (cost and currency in fba_list_transportation_options). Amazon lets a small parcel request be voided within 24 hours and an LTL/FTL request within one hour of confirmation; after that the shipping cost is charged. No new transportation options can be generated or confirmed for the plan afterwards. Availability: Every Amazon marketplace except Brazil, where Amazon does not support inbound shipment creation through the API. Amazon-partnered carriers are offered in the contiguous United States (and through the Partnered Carrier Program in India); in the EU the seller must first accept the carrier''s and Amazon''s terms in Seller Central. Scope: The seller''s data in the connection''s region: the method addresses a resource by its Amazon ID or reads seller-wide data, and Amazon answers for any marketplace of the seller in that region. Check marketplace_ids in the result where it matters.'
  operation_kind: action
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  effect_kind: amazon_fba_transportation_confirmation
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: inbound_plan_id
    value_type: text
    required: true
    schema:
      description: inbound_plan_id from fba_create_inbound_plan or fba_list_inbound_plans (wf…).
      maxLength: 38
      minLength: 38
      type: string
      title: Inbound plan ID
  - name: transportation_selections
    value_type: array
    required: true
    schema:
      description: One shipment_id with its chosen transportation_option_id per shipment.
      items:
        additionalProperties: false
        description: The transportation option selected to confirm.
        properties:
          contact_information:
            additionalProperties: false
            description: The seller's contact information.
            properties:
              email:
                description: The email address.
                maxLength: 1024
                minLength: 1
                type: string
              name:
                description: The contact's name.
                maxLength: 50
                minLength: 1
                type: string
              phone_number:
                description: The phone number.
                maxLength: 20
                minLength: 1
                type: string
            required:
            - name
            - phone_number
            type: object
            examples:
            - email: email@email.com
              name: name
              phone_number: '1234567890'
          shipment_id:
            description: 'Shipment ID that the transportation Option is for. Format (checked by Amazon): ^[a-zA-Z0-9-]*$'
            maxLength: 38
            minLength: 38
            type: string
          transportation_option_id:
            description: 'Transportation option being selected for the provided shipment. Format (checked by Amazon): ^[a-zA-Z0-9-]*$'
            maxLength: 38
            minLength: 38
            type: string
        required:
        - shipment_id
        - transportation_option_id
        type: object
      minItems: 1
      type: array
      title: Transportation selections
      examples:
      - - shipment_id: sh1234abcd-1234-abcd-5678-1234abcd5678
          transportation_option_id: to1234abcd-1234-abcd-5678-1234abcd5678
  outputs:
  - name: operation_id
    value_type: text
    schema:
      type:
      - string
      - 'null'
  - name: inbound_plan_id
    value_type: text
    schema:
      type: string
  - name: transportation_selections
    value_type: array
    schema:
      type: array
      items:
        type: object
        properties:
          shipment_id:
            type:
            - string
            - 'null'
          transportation_option_id:
            type:
            - string
            - 'null'
  - name: charge_notice
    value_type: text
    schema:
      type: string
  - name: note
    value_type: text
    schema:
      type: string
  - name: amazon_operation
    value_type: text
    schema:
      type: string
  - name: api_version
    value_type: text
    schema:
      type: string
  - name: amazon_request_id
    value_type: text
    schema:
