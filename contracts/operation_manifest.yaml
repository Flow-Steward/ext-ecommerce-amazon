- operation_id: list_financial_records
  display_name: List financial records
  description: 'Returns one page of financial records posted in a time window: 2024-06-19 transactions (default) or v0 financial events, flattened into one list. Each record has record_type, posted_date, amazon_order_id (when present), amounts (labelled money values, never summed across currencies), origin and Amazon''s object under amazon. v0 events and 2024-06-19 transactions are not interchangeable and share no ID: never mix records of both versions to deduplicate or reconcile. Amazon may take up to 48 hours to post an event, so a window ending now is not complete yet.'
  operation_kind: source
  category: ecommerce
  connection_type_ids:
  - amazon_seller
  workflow_visible: true
  required_oauth_scopes: []
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: api_version
    value_type: text
    required: false
    schema:
      type: string
      title: Amazon API version
      description: 2024-06-19 (listTransactions, default) or v0 (financial events; Amazon removes listFinancialEvents, listFinancialEventsByGroupId and listFinancialEventsByOrderId on 2027-08-27). The two versions return different records with no shared ID; do not mix them.
      enum:
      - '2024-06-19'
      - v0
  - name: posted_after
    value_type: text
    required: false
    schema:
      type: string
      title: Posted after
      description: Records posted at or after this time; at least two minutes in the past. ISO 8601 with a time zone, for example 2026-11-01T00:00:00Z.
      minLength: 1
      maxLength: 40
  - name: posted_before
    value_type: text
    required: false
    schema:
      type: string
      title: Posted before
      description: 'Records posted before this time (default: two minutes ago). At most 180 days after posted_after. ISO 8601 with a time zone, for example 2026-11-01T00:00:00Z.'
      minLength: 1
      maxLength: 40
  - name: transaction_status
    value_type: text
    required: false
    schema:
      type: string
      title: Transaction status (2024-06-19)
      description: Only transactions in this status.
      enum:
      - DEFERRED
      - RELEASED
      - DEFERRED_RELEASED
  - name: omit_marketplace_filter
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Do not filter by marketplace (2024-06-19)
