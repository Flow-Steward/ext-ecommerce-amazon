- operation_id: update_shipment_status
  display_name: Update shipment status
  description: 'Sets the shipment status of a merchant-fulfilled order to ReadyForPickup, PickedUp or RefusedPickup, for the whole order or for the listed items. Amazon answers without the new order state; read the order afterwards. Orders v0 only: Orders 2026-01-01 has no equivalent, and this call is not in Amazon''s v0 deprecation schedule.'
