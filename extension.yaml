  - {operation_id: fba_update_shipment_name, effect_kind: amazon_fba_shipment_rename, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: fba_update_shipment_source_address, effect_kind: amazon_fba_shipment_source_address_update, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: fba_update_shipment_tracking_details, effect_kind: amazon_fba_shipment_tracking_update, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
