  - {operation_id: cancel_shipping_shipment, effect_kind: amazon_shipping_label_cancellation, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: create_listing, effect_kind: amazon_listing_put, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: update_listing_attributes, effect_kind: amazon_listing_patch, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: delete_listing, effect_kind: amazon_listing_deletion, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
