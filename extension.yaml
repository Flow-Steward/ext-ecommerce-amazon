  - {operation_id: fba_cancel_self_ship_appointment, effect_kind: amazon_fba_appointment_cancellation, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: create_feed, effect_kind: amazon_feed_submission, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: cancel_feed, effect_kind: amazon_feed_cancellation, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: cancel_report, effect_kind: amazon_report_cancellation, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
runtime:
  contract_version: extension_host_v2
  compatibility: {platform_min: 1.6.0}
  extension_contract_v2:
    oauth_providers:
      - provider_id: amazon_lwa
        display_name: Amazon SP-API application
        description: The LWA credentials of your private Selling Partner API application. Each seller account is connected by importing the refresh token from its self-authorization.
        setup_page_id: setup-guide
        help_page_id: setup-guide
        error_help_anchors:
          invalid_client: app-credentials
          authorization_required: refresh-token
        # A private SP-API application is authorized by the seller in Seller
        # Central, which shows the refresh token once. There is no redirect and
        # no callback; the platform exchanges the pasted token at LWA and keeps
        # it. The extension only ever receives access tokens.
        flow: {type: refresh_token_import}
        credential_fields:
          - {field_id: client_id, value_type: text, required: true, secret: false, change_policy: reauthorization_required, label: LWA Client ID, help_text: "Solution Provider Portal > Developer Central > your app > View (LWA credentials). Starts with amzn1.application-oa2-client.", autocomplete: username, validation: {min_length: 1, max_length: 512}}
          - {field_id: client_secret, value_type: secret, required: true, secret: true, change_policy: runtime_revalidate, label: LWA Client Secret, help_text: "The client secret shown next to the Client ID. Amazon makes you rotate it periodically; paste the new one here when you do.", autocomplete: current-password, validation: {min_length: 1, max_length: 4096}}
        token_endpoint: {url: https://api.amazon.com/auth/o2/token, client_auth_method: client_secret_post}
        post_connect_action_id: verify_connection
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
artifact_policies:
- operation_id: get_shipping_documents
  outputs:
  - kind: artifact
    value_type: artifact_handle
    binding_key: amazon_shipping_document
    filename: amazon-shipping-document
    content_type: application/octet-stream
    max_size_bytes: 209715200
    max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES
    retention_class: run_window
    presentation: {claim_output: document_file}
- operation_id: fba_create_marketplace_item_labels
  outputs:
  - kind: artifact
    value_type: artifact_handle
    binding_key: amazon_fba_document
    filename: amazon-fba-document
    content_type: application/octet-stream
    max_size_bytes: 209715200
    max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES
    retention_class: run_window
    presentation: {claim_output: document_file}
- operation_id: fba_get_labels
  outputs:
  - kind: artifact
    value_type: artifact_handle
    binding_key: amazon_fba_document
    filename: amazon-fba-document
    content_type: application/octet-stream
    max_size_bytes: 209715200
    max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES
    retention_class: run_window
    presentation: {claim_output: document_file}
- operation_id: fba_get_bill_of_lading
  outputs:
  - kind: artifact
    value_type: artifact_handle
    binding_key: amazon_fba_document
    filename: amazon-fba-document
    content_type: application/octet-stream
    max_size_bytes: 209715200
    max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES
    retention_class: run_window
    presentation: {claim_output: document_file}
- operation_id: fba_get_delivery_challan_document
  outputs:
  - kind: artifact
    value_type: artifact_handle
    binding_key: amazon_fba_document
    filename: amazon-fba-document
    content_type: application/octet-stream
    max_size_bytes: 209715200
    max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES
    retention_class: run_window
    presentation: {claim_output: document_file}
- operation_id: upload_feed_document
  inputs:
  - {kind: artifact, value_type: artifact_handle, binding_key: amazon_feed_input, field: content_file, required: false, max_size_bytes: 10485760}
- operation_id: get_feed_result
  outputs:
  - {kind: artifact, value_type: artifact_handle, binding_key: amazon_feed_result, filename: amazon-feed-processing-report.json, content_type: application/json, max_size_bytes: 209715200, max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES, retention_class: run_window}
- operation_id: download_report
  outputs:
  - {kind: artifact, value_type: artifact_handle, binding_key: amazon_report_document, filename: amazon-report.tsv, content_type: text/tab-separated-values, max_size_bytes: 209715200, max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES, retention_class: run_window}
entrypoint: {mode: subprocess, command: [python3, main.py], timeout_seconds: 180}
health: {command: [python3, health.py], timeout_seconds: 5}
ui_manifest: ui/ui_manifest.yaml
action_manifest: ui/actions/actions.yaml
python_requirements: []
