  - {operation_id: fba_set_prep_details, effect_kind: amazon_fba_prep_details_update, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: fba_create_inbound_plan, effect_kind: amazon_fba_inbound_plan_creation, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: fba_cancel_inbound_plan, effect_kind: amazon_fba_inbound_plan_cancellation, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: fba_update_inbound_plan_name, effect_kind: amazon_fba_inbound_plan_rename, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: fba_generate_packing_options, effect_kind: amazon_fba_packing_options_generation, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: fba_confirm_packing_option, effect_kind: amazon_fba_packing_option_confirmation, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: fba_set_packing_information, effect_kind: amazon_fba_packing_information_update, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: fba_generate_placement_options, effect_kind: amazon_fba_placement_options_generation, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: fba_confirm_placement_option, effect_kind: amazon_fba_placement_option_confirmation, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: fba_generate_transportation_options, effect_kind: amazon_fba_transportation_options_generation, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: fba_confirm_transportation_options, effect_kind: amazon_fba_transportation_confirmation, channel: amazon_sp_api, idempotency: required, test_mode_behavior: suppress}
